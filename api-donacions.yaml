openapi: 3.0.1
info:
  title: API Donaciones DonaTrack
  description: Esta api se encarga de gestionar el crud para las donaciones en el sistema.
  version: 1.0.0


servers:
  - url: http://localhost:8080/api/donaciones/

tags:
  - name: donaciones
    description: Este endpoint se encarga de gestionar las donaciones en el sistema.

paths:
  /:
    post:
      tags:
        - donaciones
      summary: Inserta una donacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BodyDonacionesPost'
      responses:
        '200':
          description: Todo salio bien.
    get:
      tags:
        - donaciones
      summary: Obtiene todas las donaciones
      description: Devuelve una lista con todas las donaciones registradas en el sistema.
      responses:
        '200':
          description: Lista de donaciones obtenida correctamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BodyDonacionesPost'



  /{idDonacion}:
    get:
      tags:
        - donaciones
      summary: Obtengo la información de la donacion con el id pasado por la url
      parameters:
        - name: idDonacion
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Todo salio bien.

    delete:
      tags:
        - donaciones
      summary: Elimina una donación
      description: Elimina la donación cuyo identificador se recibe por la URL.
      parameters:
        - name: idDonacion
          in: path
          required: true
          description: Identificador único de la donación.
          schema:
            type: integer
      responses:
        '200':
          description: Donación eliminada correctamente.
        '404':
          description: No existe una donación con el identificador indicado.

components:
  schemas:
    BodyDonacionesPost:
      type: object
      properties:
        id:
          type: integer
        Donante:
          type: object
        descripcionGeneral:
          type: string
        fechaRegistro:
          type: string
          format: date
        bienesDeEntrada:
          type: array
          items:
            $ref: '#/components/schemas/Bien'

    Bien:
      type: object
      properties:
        nombre:
          type: string
           