openapi: 3.0.1

info:
  title: API Donaciones DonaTrack
  description: API REST para gestionar las donaciones del sistema.
  version: 1.0.0

servers:
  - url: http://localhost:8080

tags:
  - name: Donaciones
    description: Operaciones sobre las donaciones.

paths:

  /api/donaciones:

    get:
      tags:
        - Donaciones
      summary: Obtener todas las donaciones
      responses:
        '200':
          description: Lista de donaciones obtenida correctamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Donacion'

    post:
      tags:
        - Donaciones
      summary: Crear una nueva donación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Donacion'
      responses:
        '200':
          description: Donación creada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donacion'


    put:
      tags:
        - Donaciones
      summary: Actualizar una donación existente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Donacion'
      responses:
        '200':
          description: Donación actualizada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donacion'


  /api/donaciones/{idDonacion}:

    get:
      tags:
        - Donaciones
      summary: Obtener una donación por su ID
      parameters:
        - name: idDonacion
          in: path
          required: true
          description: Identificador de la donación.
          schema:
            type: integer
      responses:
        '200':
          description: Donación encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donacion'
        '404':
          description: Donación no encontrada.


    delete:
      tags:
        - Donaciones
      summary: Eliminar una donación por su ID
      parameters:
        - name: idDonacion
          in: path
          required: true
          description: Identificador de la donación.
          schema:
            type: integer
      responses:
        '200':
          description: Donación eliminada correctamente.


components:

  schemas:

    Donacion:
      type: object
      properties:
        id:
          type: integer
          description: Identificador de la donación