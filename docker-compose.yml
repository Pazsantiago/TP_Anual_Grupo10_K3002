services:

  mysql:
    image: mysql:8.0
    container_name: mysql-donaciones
    environment:
      MYSQL_ROOT_PASSWORD: Clave12345%
      MYSQL_DATABASE: db_donaciones
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  donaciones:
    build: .
    container_name: donaciones
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_donaciones
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Clave12345%
    depends_on:
      - mysql
      
volumes:
  mysql_data: