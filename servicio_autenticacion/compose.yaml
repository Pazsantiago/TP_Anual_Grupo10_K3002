
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: donatrack-keycloak

    command: start-dev

    ports:
      - "127.0.0.1:8180:8080"

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}

    volumes:
      - keycloak_data:/opt/keycloak/data

volumes:
  keycloak_data:
