
# Nombre del servicio
spring.application.name=servicio_autenticacion

# Puerto del servicio
server.port=8085

# Cliente de Keycloak
spring.security.oauth2.client.registration.keycloak.client-id=donatrack-auth
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}

# Flujo OAuth2
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code

# Datos solicitados
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email

# Redireccion luego de autenticar
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Servidor de identidad
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8180/realms/donatrack

# =====================================
# CLIENTE LIVIANO
# =====================================

cliente.liviano.url=${CLIENTE_LIVIANO_URL:http://localhost:8086}

# =====================================
# SPRING CLOUD GATEWAY
# =====================================

# Ruta hacia el Cliente Liviano
spring.cloud.gateway.server.webmvc.routes[0].id=cliente-liviano

# Servidor de destino
spring.cloud.gateway.server.webmvc.routes[0].uri=${cliente.liviano.url}

# Peticiones que redirige el Gateway
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/app/**

# Propagar Access Token
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=TokenRelay=

