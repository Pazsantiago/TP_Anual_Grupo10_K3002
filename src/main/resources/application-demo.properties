# Perfil solo para demos/pruebas locales: envía los mails a MailHog en vez de a un SMTP real.
# Levantar antes: docker compose -f docker-compose-demo.yml up -d
# Correr la app con: mvn spring-boot:run -Dspring-boot.run.profiles=demo
# Ver los mails "enviados" en: http://localhost:8025

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=
spring.mail.password=

spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
