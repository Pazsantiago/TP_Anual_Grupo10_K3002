# Perfil para Render (PostgreSQL). Se activa con SPRING_PROFILES_ACTIVE=prod
# Variables: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD (render.yaml las completa solas)
# o bien DB_URL completa en formato JDBC: jdbc:postgresql://host:5432/base

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notificaciones}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea/ajusta las tablas destinatario y notificacion al arrancar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
