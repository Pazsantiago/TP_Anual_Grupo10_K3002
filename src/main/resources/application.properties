spring.application.name=Logistica
spring.datasource.url=jdbc:mysql://localhost:3306/logistica
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8081

# Nivel de log global
logging.level.root=INFO

# Nivel de log para Spring Boot
logging.level.org.springframework.boot=DEBUG

# Nivel de log para tu aplicación
logging.level.com.Donatrack.Logistica=DEBUG
logging.file.name=logistica.log
logging.file.path=./logs

