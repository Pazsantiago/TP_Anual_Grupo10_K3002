spring.application.name=donatrack-frontend
server.port=8080

spring.config.import=optional:file:.env[.properties]

donatrack.services.notificaciones.base-url=${NOTIFICACIONES_URL:http://localhost:8081}
donatrack.services.notificaciones.connect-timeout=2s
donatrack.services.notificaciones.read-timeout=5s
donatrack.services.donaciones.base-url=${DONACIONES_URL:http://localhost:8090}
donatrack.services.incentivos.base-url=${INCENTIVOS_URL:http://localhost:8091}
donatrack.services.logistica.base-url=${LOGISTICA_URL:http://localhost:8092}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=40MB

donatrack.services.donaciones.read-timeout=${DONACIONES_READ_TIMEOUT:120s}
donatrack.services.logistica.read-timeout=${LOGISTICA_READ_TIMEOUT:60s}

spring.security.oauth2.client.registration.keycloak.client-id=cliente-liviano
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:secreto}
spring.security.oauth2.client.registration.keycloak.scope[0]=openid
spring.security.oauth2.client.registration.keycloak.scope[1]=profile
spring.security.oauth2.client.registration.keycloak.scope[2]=email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/keycloak

spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/donatrack}

backend.auth.url=${AUTH_URL:http://localhost:8083}