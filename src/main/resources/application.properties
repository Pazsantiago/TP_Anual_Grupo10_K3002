spring.application.name=Logistica
spring.datasource.url=jdbc:h2:mem:logistica;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
server.port=8081

# Nivel de log global
logging.level.root=INFO

# Nivel de log para Spring Boot
logging.level.org.springframework.boot=DEBUG

# Nivel de log para tu aplicación
logging.level.com.Donatrack.Logistica=DEBUG
logging.file.name=logistica.log
logging.file.path=./logs
