spring.application.name=donatrack-frontend
server.port=8080

# Carga el archivo .env (la carpeta desde donde ejecutás la app). Si no existe, sigue igual.
spring.config.import=optional:file:.env[.properties]

# ---- Servicio de Notificaciones ----
donatrack.services.notificaciones.base-url=${NOTIFICACIONES_URL:http://localhost:8081}
donatrack.services.notificaciones.connect-timeout=2s
donatrack.services.notificaciones.read-timeout=5s
donatrack.services.donaciones.base-url=${DONACIONES_URL:http://localhost:8090}
donatrack.services.incentivos.base-url=${INCENTIVOS_URL:http://localhost:8091}
donatrack.services.logistica.base-url=${LOGISTICA_URL:http://localhost:8092}

# ---- Subidas (CSV de donantes con +10.000 filas, fotos de bienes y de recepciones) ----
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=40MB

# La importacion masiva y la carga de fotos tardan mas que una consulta comun
donatrack.services.donaciones.read-timeout=${DONACIONES_READ_TIMEOUT:120s}
donatrack.services.logistica.read-timeout=${LOGISTICA_READ_TIMEOUT:60s}
