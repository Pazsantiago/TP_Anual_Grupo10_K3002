spring.application.name=servicio-notificaciones
server.port=8083
server.address = 0.0.0.0

# =========================
# EMAIL - BREVO
# =========================

brevo.api.url=https://api.brevo.com/v3/smtp/email
brevo.api.key=${BREVO_API_KEY}

brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME:DonaTrack}

# =========================
# SMS - TWILIO
# =========================

twilio.sms.url=https://api.twilio.com/2010-04-01/Accounts/{accountSid}/Messages.json

twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.phone-number=${TWILIO_PHONE_NUMBER}

# =========================
# BASE DE DATOS - HIBERNATE / JPA (MySQL)
# =========================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/notificaciones?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# update: Hibernate crea/ajusta las tablas destinatario y notificacion a partir de las entidades.
# (En producción real conviene "validate" + migraciones con Flyway/Liquibase.)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
