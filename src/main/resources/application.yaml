spring:
  application:
    name: donaciones-frontend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: cliente-liviano
            client-secret: ${KEYCLOAK_CLIENT_SECRET:secreto}
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/donatrack}

keycloak:
  realm: ${REALM:donatrack}
  admin:
    client-id:
      ${CLIENT_ID: admin-cli}
    client-secret: ${CLIENT_SECRET:secreto}
    username: ${CLIENT_USERNAME:admin}
    password: ${CLIENT_PASSWORD:admin}

server:
  port: 8086
  forward-headers-strategy: framework

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:8080}
backend:
  servicio-donaciones:
    url: ${SERVICIO_DONACIONES:http://localhost:8080}
  servicio-incentivos:
    url: ${SERVICIO_INCENTIVOS:http://localhost:8081}
  servicio-logistica:
    url: ${SERVICIO_LOGISTICA:http://localhost:8082}
  auth:
    url: ${AUTH_URL:http://localhost:8083}
