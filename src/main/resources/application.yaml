spring:
  application:
    name: cola-de-notificaciones
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${conexiones.auth-url}/realms/donatrack

keycloak:
  realm: ${REALM:donatrack}
  admin:
    client-id:
      ${CLIENT_ID: admin-cli}
    client-secret: ${CLIENT_SECRET:}
    username:
      ${CLIENT_USERNAME:admin}
    password: ${CLIENT_PASSWORD:admin}
server:
  PORT: ${SERVER_PORT:8082}

conexiones:
  servicio-notificaciones: ${SERVICIO_NOTIFICACIONES:http://localhost:8083}
  auth-url: ${AUTH_URL:http://localhost:8085}