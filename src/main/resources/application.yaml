spring:
  application:
    name: donaciones-frontend
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: cliente-liviano
            client-secret: ${KEYCLOAK_CLIENT_SECRET:secreto}
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/donatrack}


server:
  port: 8086

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:8080}
backend:
  servicio-donaciones:
    url: ${SERVICIO_DONACIONES:http://localhost:8080}
  servicio-incentivos:
    url: ${SERVICIO_INCENTIVOS:http://localhost:8081}
  servicio-logistica:
    url: ${SERVICIO_LOGISTICA:http://localhost:8082}
  auth:
    url: ${AUTH_URL:http://localhost:8083}
