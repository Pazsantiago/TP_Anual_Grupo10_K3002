spring:
  application:
    name: cola-de-notificaciones
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:${conexiones.auth-url}/realms/donatrack}

server:
  PORT: ${SERVER_PORT:8082}

conexiones:
  servicio-notificaciones: ${SERVICIO_NOTIFICACIONES:http://localhost:8083}
  auth-url: ${AUTH_URL:http://localhost:8085}