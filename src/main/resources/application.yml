spring:
  application:
    name: servicio-donaciones
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:postgresql://localhost:5432/db_donaciones
    username: postgres
    password: Clave12345%
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: public
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${conexiones.auth-url}/realms/donatrack

keycloak:
  realm: ${REALM:donatrack}
  admin:
    client-id:
      ${CLIENT_ID: admin-cli}
    client-secret: ${CLIENT_SECRET:}
    username:
      ${CLIENT_USERNAME:admin}
    password: ${CLIENT_PASSWORD:admin}

diasTolerablesDeVencimiento: ${DIASTOLERABLESDEVENCIMIENTO:14}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /api-docs

conexiones:
  servicio-incentivos: ${SERVICIO_INCENTIVOS_URL:http://localhost:8081/incentivos}
  cola-de-mensajes: ${COLA_DE_MENSAJES:http://localhost:8082}
  broker-logistica: ${BROKER_LOGISTICA:http://localhost:8083}
  auth-url: ${AUTH_URL:http://localhost:8085}

horario-baja-carga:
  cron: ${HORARIO_CRON:0 0 3-8 * * *}

