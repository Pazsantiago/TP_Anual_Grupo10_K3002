spring:
  application:
    name: servicio-donaciones

  datasource:
    url: jdbc:mysql://localhost:3306/db_donaciones
    username: root
    password: Clave12345%
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true



server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /endpoints-docs

conexiones:
  servicio-incentivos: ${SERVICIO_INCENTIVOS_URL:http://localhost:8081/incentivos}
  cola-de-mensajes: ${COLA_DE_MENSAJES:http://localhost:8082}
  broker-logistica: ${BROKER_LOGISTICA:http://localhost:8083}

horario-baja-carga:
  cron: ${HORARIO_CRON:0 0 3-8 * * *}


