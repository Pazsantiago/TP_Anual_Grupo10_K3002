<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="container py-4 bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-secondary text-white">
                <h4 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Agregar Donación a Asignación Existente</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted">Utilizá esta opción si la asignación previa quedó corta de insumos y necesitás sumar un nuevo segmento de donación.</p>

                <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form th:action="@{/asignaciones/agregar-segmentada}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-bold">ID Donación Asignada Existente</label>
                        <input type="number" name="idDonacionAsignada" class="form-control" placeholder="Ej: 1" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">ID Donación Segmentada Adicional</label>
                        <input type="number" name="idDonacionSegmentada" class="form-control" placeholder="Ej: 8" required>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <a href="/home" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-secondary">
                            <i class="bi bi-plus-lg me-1"></i> Agregar a Asignación
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
