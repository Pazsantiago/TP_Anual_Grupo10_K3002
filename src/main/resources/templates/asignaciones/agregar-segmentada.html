<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Agregar segmentada')}"></head>
<body>

<header th:replace="~{fragments/organisms :: encabezado('donaciones')}"></header>

<main id="contenido" class="container page" style="max-width: var(--form-max);">
    <header class="page-head">
        <h1 class="page-head__title">Agregar Donación Segmentada a Asignación</h1>
    </header>

    <div th:replace="~{fragments/molecules :: mensajes}"></div>
    <p class="banner banner--error" role="alert" th:if="${error != null}" th:text="${error}"></p>

    <section class="card">
        <form class="form" th:action="@{/asignaciones/agregar-segmentada}" method="post">
            <fieldset class="fieldset">
                <legend class="fieldset__legend">Vincular Lote Adicional</legend>

                <div class="field">
                    <label class="field__label" for="idDonacionAsignada">ID Donación Asignada Existente <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                    <input class="field__control" type="number" id="idDonacionAsignada" name="idDonacionAsignada" placeholder="Ej: 1" required>
                </div>

                <div class="field">
                    <label class="field__label" for="idDonacionSegmentada">ID Donación Segmentada Adicional <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                    <input class="field__control" type="number" id="idDonacionSegmentada" name="idDonacionSegmentada" placeholder="Ej: 8" required>
                </div>
            </fieldset>

            <div class="cluster">
                <button type="submit" class="btn">Agregar a Asignación</button>
                <a th:href="@{/home}" class="btn btn--secondary">Cancelar</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/organisms :: pie}"></footer>
</body>
</html>
