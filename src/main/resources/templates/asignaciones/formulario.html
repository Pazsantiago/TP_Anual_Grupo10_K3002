<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Asignación de donación a necesidad')}"></head>
<body>

<header th:replace="~{fragments/organisms :: encabezado('donaciones')}"></header>

<main id="contenido" class="container page" style="max-width: var(--form-max);">
    <header class="page-head">
        <h1 class="page-head__title">Asignar Donación a Necesidad</h1>
    </header>

    <div th:replace="~{fragments/molecules :: mensajes}"></div>
    <p class="banner banner--error" role="alert" th:if="${error != null}" th:text="${error}"></p>

    <section class="card">
        <form class="form" th:action="@{/asignaciones/nueva}" method="post">
            <fieldset class="fieldset">
                <legend class="fieldset__legend">Parámetros de Asignación</legend>

                <div class="field">
                    <label class="field__label" for="selectEntidad">1. Entidad Beneficiaria <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                    <select id="selectEntidad" name="idEntidad" class="field__control" required>
                        <option value="">-- Seleccionar Entidad Beneficiaria --</option>
                        <option th:each="e : ${entidades}"
                                th:value="${e.id}"
                                th:text="${e.razonSocial}">
                        </option>
                    </select>
                </div>

                <div class="field">
                    <label class="field__label" for="idNecesidad">2. ID Necesidad de la Entidad <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                    <input class="field__control" type="number" id="idNecesidad" name="idNecesidad" placeholder="Ej: 2" required>
                </div>

                <div class="field">
                    <label class="field__label" for="idDonacionSegmentada">3. ID Donación Segmentada en Depósito <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                    <input class="field__control" type="number" id="idDonacionSegmentada" name="idDonacionSegmentada" placeholder="Ej: 5" required>
                </div>
            </fieldset>

            <div class="cluster">
                <button type="submit" class="btn">Confirmar Asignación</button>
                <a th:href="@{/home}" class="btn btn--secondary">Cancelar</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/organisms :: pie}"></footer>
</body>
</html>
