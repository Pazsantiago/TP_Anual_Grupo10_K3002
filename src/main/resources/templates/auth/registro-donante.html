<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Registro de donante')}"></head>
<body>
<header th:replace="~{fragments/organisms :: encabezado-publico('registro')}"></header>

<main id="contenido" class="container page">
  <nav th:replace="~{fragments/molecules :: migas}"></nav>

  <header class="page-head">
    <h1 class="page-head__title">Registrarme como donante</h1>
    <div class="cluster">
      <a class="btn btn--secondary" th:href="@{/registro/entidad}">Soy una entidad beneficiaria</a>
    </div>
  </header>

  <div th:replace="~{fragments/molecules :: mensajes}"></div>

  <section class="card">
    <form class="form" th:action="@{/registro/donante}" method="post">
      <p class="form__note">Los campos marcados con <span class="field__required" aria-hidden="true">*</span> son obligatorios. También podés registrarte en el depósito al llevar tu donación.</p>
      <th:block th:replace="~{fragments/formularios :: datos-donante(true)}"></th:block>
      <div class="cluster">
        <button class="btn" type="submit">Crear mi cuenta</button>
        <a class="btn btn--secondary" th:href="@{/login}">Ya tengo cuenta</a>
      </div>
    </form>
  </section>
</main>

<footer th:replace="~{fragments/organisms :: pie}"></footer>
</body>
</html>
