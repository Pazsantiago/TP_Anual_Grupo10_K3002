<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Listado de asignaciones')}"></head>
<body>

<header th:replace="~{fragments/organisms :: encabezado('donaciones')}"></header>

<main id="contenido" class="container page">
    <header class="page-head">
        <h1 class="page-head__title">Donaciones Asignadas por Entidad</h1>
    </header>

    <div th:replace="~{fragments/molecules :: mensajes}"></div>

    <form method="get" th:action="@{/asignaciones}" class="card form form--wide mb-4">
        <div class="field-row">
            <div class="field">
                <label class="field__label" for="selectEntidad">Seleccionar Entidad Beneficiaria:</label>
                <select id="selectEntidad" name="idEntidad" class="field__control" onchange="this.form.submit()">
                    <option value="" disabled th:selected="${idEntidadSeleccionada == null}">-- Seleccionar Entidad --</option>
                    <option th:each="e : ${entidades}"
                            th:value="${e.id}"
                            th:text="${e.razonSocial}"
                            th:selected="${e.id == idEntidadSeleccionada}">
                    </option>
                </select>
            </div>
        </div>
    </form>

    <div th:if="${idEntidadSeleccionada != null}">
        <div class="table-wrap" role="region" aria-label="Tabla de Asignaciones" tabindex="0">
            <table class="table">
                <thead>
                <tr>
                    <th scope="col">ID Asignación</th>
                    <th scope="col">Dirección Entidad</th>
                    <th scope="col">Donaciones Segmentadas Vinculadas</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="asig : ${asignaciones}">
                    <td th:text="'#' + ${asig.idAsignada}">#1</td>
                    <td th:text="${asig.direccionEntidad}">Av. Medrano 951</td>
                    <td>
                        <ul th:if="${asig.donacionesSegmentadas != null and !#lists.isEmpty(asig.donacionesSegmentadas)}">
                            <li th:each="seg : ${asig.donacionesSegmentadas}">
                                <span th:text="'Segmentada #' + ${seg.idSegmentada} + ' (' + ${seg.categoria} + ' - ' + ${seg.subcategoria} + ') - Cantidad: ' + ${seg.cantidadActual} + ' ' + ${seg.unidad}"></span>
                            </li>
                        </ul>
                        <span th:if="${asig.donacionesSegmentadas == null or #lists.isEmpty(asig.donacionesSegmentadas)}" class="field__hint">Sin segmentadas cargadas</span>
                    </td>
                </tr>
                <tr th:if="${asignaciones == null or #lists.isEmpty(asignaciones)}">
                    <td colspan="3">
                        <div th:replace="~{fragments/molecules :: estado-vacio('No hay asignaciones registradas para esta entidad.')}"></div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:if="${idEntidadSeleccionada == null}">
        <div th:replace="~{fragments/molecules :: estado-vacio('Por favor, selecciona una entidad para listar sus asignaciones.')}"></div>
    </div>
</main>

<footer th:replace="~{fragments/organisms :: pie}"></footer>
</body>
</html>
