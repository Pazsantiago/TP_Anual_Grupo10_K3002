<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<h2 class="mb-4">Nueva Donación de Bienes</h2>

<form th:action="@{/donaciones/nueva}" method="post" class="card p-4 shadow-sm">

    <input type="hidden" name="idDonante" th:value="${idDonanteSeleccionado}" />

    <div class="mb-3">
        <label class="form-label fw-bold">Descripción General de la Donación</label>
        <input type="text" name="descripcionGeneral" class="form-control" placeholder="Ej: Donación mensual de alimentos secos" required>
    </div>

    <h5 class="mt-3 text-success">Datos del Bien Donado</h5>
    <div class="row g-2 mb-3">
        <div class="col-md-6">
            <label class="form-label">Descripción del Bien</label>
            <input type="text" name="bienesDeEntrada[0].descripcion" class="form-control" placeholder="Ej: Arroz 1kg" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">Nombre Subcategoría</label>
            <input type="text" name="bienesDeEntrada[0].subcategoria.nombre" class="form-control" placeholder="arroz" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">ID Categoría Padre</label>
            <input type="number" name="bienesDeEntrada[0].subcategoria.categoria.id" class="form-control" value="1" required>
        </div>
    </div>

    <div class="row g-2 mb-3">
        <div class="col-md-4">
            <label class="form-label">Cantidad</label>
            <input type="number" name="bienesDeEntrada[0].cantidadOriginal" class="form-control" min="1" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Unidad de Medida</label>
            <select name="bienesDeEntrada[0].unidad" class="form-select">
                <option value="KILOGRAMOS">Kilogramos</option>
                <option value="LITROS">Litros</option>
                <option value="UNIDADES">Unidades</option>
                <option value="CAJAS">Cajas</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">Tipo de Bien</label>
            <select name="bienesDeEntrada[0].tipo" class="form-select">
                <option value="CON_ESTADO">Con Estado (Mueble/Insumo)</option>
                <option value="PERECEDERO">Perecedero (Alimento)</option>
            </select>
        </div>
    </div>

    <div class="d-flex justify-content-between mt-4">
        <a th:href="@{/donaciones(idDonante=${idDonanteSeleccionado})}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-success">Guardar Donación</button>
    </div>
</form>
</body>
</html>
