<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="container py-4">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<h2 class="mb-4">Nueva Donación de Bienes</h2>

<form th:action="@{/donaciones}" th:object="${donacion}" method="post">

    <div class="card mb-4">
        <div class="card-header bg-light fw-bold">Descripción General</div>
        <div class="card-body">
            <label class="form-label">Descripción General de la Donación</label>
            <input type="text" th:field="*{descripcion}" class="form-control" required/>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header bg-light fw-bold">Datos del Bien Donado</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-12">
                    <label class="form-label">Descripción del Bien</label>
                    <input type="text" th:field="*{bienesDeEntrada[0].descripcion}" class="form-control" required/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Subcategoría</label>
                    <input type="text" th:field="*{bienesDeEntrada[0].subcategoria.nombre}" class="form-control" required/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">ID Categoría Padre</label>
                    <input type="number" th:field="*{bienesDeEntrada[0].subcategoria.categoria.id}" class="form-control" required/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Cantidad</label>
                    <input type="number" th:field="*{bienesDeEntrada[0].cantidad}" class="form-control" required/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Unidad de Medida</label>
                    <select th:field="*{bienesDeEntrada[0].unidadMedida}" class="form-select">
                        <option value="KILOGRAMOS">Kilogramos</option>
                        <option value="LITROS">Litros</option>
                        <option value="UNIDADES">Unidades</option>
                        <option value="CAJAS">Cajas</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex gap-2">
        <a th:href="@{/donantes}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-success">Guardar Donación</button>
    </div>
</form>
</body>
</html>
