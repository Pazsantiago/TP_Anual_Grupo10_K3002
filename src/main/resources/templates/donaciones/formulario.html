<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container col-md-6">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4>Registrar Donación</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/donantes/{id}/donaciones(id=${idDonante})}" th:object="${donacion}" method="post">
                <input type="text" th:field="*{descripcionGeneral}" placeholder="Descripción General" class="form-control mb-3">

                <h5>Bien a Donar</h5>
                <select th:field="*{bienesDeEntrada[0].tipo}" class="form-select mb-2">
                    <option value="CON_ESTADO">Con Estado</option>
                    <option value="PERECEDERO">Perecedero</option>
                </select>
                <select th:field="*{bienesDeEntrada[0].estado}" class="form-select mb-2">
                    <option value="NUEVO">Nuevo</option>
                    <option value="USADO">Usado</option>
                </select>

                <input type="text" th:field="*{bienesDeEntrada[0].descripcion}" placeholder="Descripción del Bien (ej: Algo1)" class="form-control mb-2">
                <input type="text" th:field="*{bienesDeEntrada[0].subcategoria.nombre}" placeholder="Subcategoría (ej: arroz)" class="form-control mb-2">
                <input type="number" th:field="*{bienesDeEntrada[0].subcategoria.categoria.id}" value="1" class="form-control mb-2" placeholder="ID Categoría">

                <select th:field="*{bienesDeEntrada[0].unidad}" class="form-select mb-2">
                    <option value="KILOGRAMOS">Kilogramos</option>
                    <option value="UNIDADES">Unidades</option>
                    <option value="LITROS">Litros</option>
                </select>
                <input type="number" th:field="*{bienesDeEntrada[0].cantidadOriginal}" placeholder="Cantidad" class="form-control mb-2">

                <button type="submit" class="btn btn-success mt-3">Registrar Donación</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
