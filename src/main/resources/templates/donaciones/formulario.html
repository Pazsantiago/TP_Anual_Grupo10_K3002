<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear donacion')}"></head>
<body>

<header th:replace="~{fragments/organisms :: encabezado('donaciones')}"></header>

<main id="contenido" class="container page" style="max-width: var(--container-max);">
    <header class="page-head">
        <h1 class="page-head__title">Registrar Nueva Donación</h1>
    </header>

    <div th:replace="~{fragments/molecules :: mensajes}"></div>
    <p class="banner banner--error" role="alert" th:if="${error}" th:text="${error}"></p>

    <form class="form form--wide" th:action="@{/donaciones/nueva}" th:object="${donacion}" method="post">

        <fieldset class="fieldset">
            <legend class="fieldset__legend">1. Datos Generales de la Donación</legend>
            <div class="field-row">
                <div class="field">
                    <label class="field__label" for="selectDonante">Donante <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                    <select id="selectDonante" name="idDonante" class="field__control" required>
                        <option value="">-- Seleccionar Donante --</option>
                        <option th:each="d : ${donantes}"
                                th:value="${d.id}"
                                th:text="${d.nombre}"
                                th:selected="${d.id == idDonanteSeleccionado}">
                        </option>
                    </select>
                </div>
                <div class="field">
                    <label class="field__label" for="descGeneral">Descripción General <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                    <input id="descGeneral" type="text" th:field="*{descripcionGeneral}" class="field__control" placeholder="Ej: Donación de alimentos y abrigo" required/>
                </div>
            </div>
        </fieldset>

        <fieldset class="fieldset">
            <legend class="fieldset__legend" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <span>2. Detalle de los Bienes Donados</span>
                <button type="button" class="btn btn--secondary" onclick="agregarBien()">+ Agregar otro bien</button>
            </legend>

            <div id="contenedorBienes" class="stack">
                <div class="item-bien card" data-index="0">
                    <h2>Bien #1</h2>
                    <div class="field-row">
                        <div class="field">
                            <label class="field__label">Tipo de Bien</label>
                            <select name="bienesDeEntrada[0].tipo" class="field__control select-tipo-bien" onchange="toggleCamposTipo(this)">
                                <option value="CON_ESTADO">Con Estado (No Perecedero)</option>
                                <option value="PERECEDERO">Perecedero</option>
                            </select>
                        </div>
                        <div class="field">
                            <label class="field__label">Descripción del Bien <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                            <input type="text" name="bienesDeEntrada[0].descripcion" class="field__control" placeholder="Ej: Leche Larga Vida" required/>
                        </div>
                    </div>

                    <div class="field-row">
                        <div class="field">
                            <label class="field__label">Cantidad Original <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                            <input type="number" name="bienesDeEntrada[0].cantidadOriginal" class="field__control" required min="1"/>
                        </div>
                        <div class="field">
                            <label class="field__label">Unidad de Medida <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                            <select name="bienesDeEntrada[0].unidad" class="field__control" required>
                                <option value="UNIDADES">Unidades</option>
                                <option value="KILOGRAMOS">Kilogramos</option>
                                <option value="LITROS">Litros</option>
                                <option value="CAJAS">Cajas</option>
                            </select>
                        </div>
                        <div class="field">
                            <label class="field__label">Categoría Padre <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                            <select name="bienesDeEntrada[0].subcategoria.idCategoria" class="field__control" required>
                                <option value="">-- Categoría --</option>
                                <option th:each="cat : ${categorias}"
                                        th:value="${cat.id}"
                                        th:text="${cat.nombre}">
                                </option>
                            </select>
                        </div>
                        <div class="field">
                            <label class="field__label">Nombre Subcategoría <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                            <input type="text" name="bienesDeEntrada[0].subcategoria.nombre" class="field__control" placeholder="Ej: Lácteos" required/>
                        </div>
                    </div>

                    <div class="field-row">
                        <div class="field div-estado">
                            <label class="field__label">Estado del Bien</label>
                            <select name="bienesDeEntrada[0].estado" class="field__control">
                                <option value="NUEVO">Nuevo</option>
                                <option value="USADO">Usado</option>
                            </select>
                        </div>
                        <div class="field div-vencimiento" style="display: none;">
                            <label class="field__label">Fecha de Vencimiento</label>
                            <input type="date" name="bienesDeEntrada[0].fechaVencimiento" class="field__control"/>
                        </div>
                    </div>
                </div>
            </div>
        </fieldset>

        <div class="cluster">
            <button type="submit" class="btn">Guardar Donación Completa</button>
            <a th:href="@{/donaciones}" class="btn btn--secondary">Cancelar</a>
        </div>
    </form>
</main>

<script>
    let bienIndex = 1;

    function toggleCamposTipo(selectElem) {
        const item = selectElem.closest('.item-bien');
        const divEstado = item.querySelector('.div-estado');
        const divVencimiento = item.querySelector('.div-vencimiento');
        if (selectElem.value === 'PERECEDERO') {
            divEstado.style.display = 'none';
            divVencimiento.style.display = 'block';
        } else {
            divEstado.style.display = 'block';
            divVencimiento.style.display = 'none';
        }
    }

    function agregarBien() {
        const contenedor = document.getElementById('contenedorBienes');
        const primerBien = document.querySelector('.item-bien');

        const nuevoBien = primerBien.cloneNode(true);
        nuevoBien.setAttribute('data-index', bienIndex);
        nuevoBien.querySelector('h2').innerText = 'Bien #' + (bienIndex + 1);

        nuevoBien.querySelectorAll('input, select').forEach(element => {
            let name = element.getAttribute('name');
            if (name) {
                name = name.replace(/bienesDeEntrada\\[\d+\\]/, `bienesDeEntrada[${bienIndex}]`);
                element.setAttribute('name', name);
                if (element.tagName === 'INPUT') element.value = '';
            }
        });

        contenedor.appendChild(nuevoBien);
        bienIndex++;
    }
</script>

<footer th:replace="~{fragments/organisms :: pie}"></footer>
</body>
</html>
