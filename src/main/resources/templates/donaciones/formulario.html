<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="container py-4">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<h2 class="mb-4">Registrar Nueva Donación</h2>

<form th:action="@{/donaciones(idDonante=${idDonanteSeleccionado})}" th:object="${donacion}" method="post">

    <!-- Datos Generales -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white fw-bold">1. Datos Generales de la Donación</div>
        <div class="card-body row g-3">
            <div class="col-md-6">
                <label class="form-label">Donante</label>
                <select name="idDonante" class="form-select" required>
                    <option value="">-- Seleccionar Donante --</option>
                    <option th:each="d : ${donantes}"
                            th:value="${d.id}"
                            th:text="${d.persona != null ? (d.persona instanceof T(org.example.donacionesfrontend.dominio.donante.PersonaHumana) ? d.persona.nombre : d.persona.razonSocial) : 'Donante #' + d.id}"
                            th:selected="${d.id == idDonanteSeleccionado}">
                    </option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Descripción General</label>
                <!-- CORREGIDO: descripcionGeneral en lugar de descripcion -->
                <input type="text" th:field="*{descripcionGeneral}" class="form-control" placeholder="Ej: Donación mensual de insumos" required/>
            </div>
        </div>
    </div>

    <!-- Contenedor Dinámico de Bienes (Lista Ilimitada) -->
    <div class="card mb-4">
        <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
            <span class="fw-bold">2. Detalle de los Bienes Donados</span>
            <button type="button" class="btn btn-sm btn-light fw-bold" onclick="agregarBien()">+ Agregar otro bien</button>
        </div>
        <div class="card-body" id="contenedorBienes">

            <!-- Plantilla del Bien #1 (Índice 0) -->
            <div class="item-bien border p-3 mb-3 rounded bg-light" data-index="0">
                <h5 class="text-secondary mb-3">Bien #1</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Descripción del Bien</label>
                        <input type="text" name="bienesDeEntrada[0].descripcion" class="form-control" placeholder="Ej: Harina 000" required/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Cantidad</label>
                        <input type="number" name="bienesDeEntrada[0].cantidadOriginal" class="form-control" required/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Unidad de Medida</label>
                        <select name="bienesDeEntrada[0].unidad" class="form-select">
                            <option value="KILOGRAMOS">Kilogramos</option>
                            <option value="LITROS">Litros</option>
                            <option value="UNIDADES">Unidades</option>
                            <option value="CAJAS">Cajas</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Categoría Padre</label>
                        <select name="bienesDeEntrada[0].subcategoria.categoria.id" class="form-select" required>
                            <option value="">-- Seleccionar Categoría --</option>
                            <option th:each="cat : ${categorias}"
                                    th:value="${cat.id}"
                                    th:text="${cat.nombre}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nombre Subcategoría</label>
                        <input type="text" name="bienesDeEntrada[0].subcategoria.nombre" class="form-control" placeholder="Ej: Alimentos Secos" required/>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="d-flex gap-2">
        <a th:href="@{/donaciones}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-success">Guardar Donación Completa</button>
    </div>
</form>

<script>
    let bienIndex = 1;

    function agregarBien() {
        const contenedor = document.getElementById('contenedorBienes');
        const primerBien = document.querySelector('.item-bien');

        const nuevoBien = primerBien.cloneNode(true);
        nuevoBien.setAttribute('data-index', bienIndex);
        nuevoBien.querySelector('h5').innerText = 'Bien #' + (bienIndex + 1);

        nuevoBien.querySelectorAll('input, select').forEach(element => {
            let name = element.getAttribute('name');
            if (name) {
                name = name.replace(/bienesDeEntrada\\[\d+\\]/, `bienesDeEntrada[${bienIndex}]`);
                element.setAttribute('name', name);
                if (element.tagName === 'INPUT') element.value = '';
            }
        });

        contenedor.appendChild(nuevoBien);
        bienIndex++;
    }
</script>
</body>
</html>
