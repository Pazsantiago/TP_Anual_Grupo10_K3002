<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<h2 class="mb-4">Nueva Donación de Bienes</h2>

<form th:action="@{/donaciones}" th:object="${donacion}" method="post">
    <div class="mb-3">
        <label class="form-label">Seleccionar Donante</label>
        <select class="form-select" name="id" required>
            <option value="">-- Seleccionar un donante --</option>
            <option th:each="d : ${donantes}" th:value="${d.id}"
                    th:text="${d.persona != null ? (d.persona.class.simpleName == 'PersonaHumana' ? (d.persona.nombre) : d.persona.razonSocial) : 'Donante #' + d.id}"></option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Descripción General de la Donación</label>
        <input type="text" class="form-control" name="descripcion" required placeholder="Ej: Donación de alimentos no perecederos" />
    </div>

    <div class="border p-3 mb-3 rounded bg-white">
        <h5>Datos del Bien Donado</h5>
        <div class="mb-3">
            <label class="form-label">Descripción del Bien</label>
            <input type="text" class="form-control" name="bienesDeEntrada[0].descripcion" required placeholder="Ej: Paquetes de Arroz" />
        </div>
        <div class="mb-3">
            <label class="form-label">Subcategoría</label>
            <input type="text" class="form-control" name="bienesDeEntrada[0].subcategoria.nombre" required placeholder="Ej: Arroz" />
        </div>
        <div class="mb-3">
            <label class="form-label">Cantidad / Peso</label>
            <input type="number" class="form-control" name="bienesDeEntrada[0].cantidad" required />
        </div>
    </div>

    <div class="d-flex justify-content-between mt-4">
        <a th:href="@{/donaciones}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-success">Guardar Donación</button>
    </div>
</form>
</body>
</html>
