<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container col-md-6">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4>Registrar Donación</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/donaciones}" th:object="${donacion}" method="post">

                <input type="hidden" name="idDonante" th:value="${idDonanteSeleccionado}" />

                <div class="mb-3">
                    <label class="form-label">Descripción General</label>
                    <input type="text" th:field="*{descripcionGeneral}" placeholder="Ej: Donación de alimentos secos" class="form-control" required>
                </div>

                <h5 class="mt-3">Bien a Donar</h5>
                <div class="row g-2 mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Tipo de Bien</label>
                        <select name="bienesDeEntrada[0].tipo" class="form-select">
                            <option value="CON_ESTADO">Con Estado</option>
                            <option value="PERECEDERO">Perecedero</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Estado</label>
                        <select name="bienesDeEntrada[0].estado" class="form-select">
                            <option value="NUEVO">Nuevo</option>
                            <option value="USADO">Usado</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Unidad de Medida</label>
                        <select name="bienesDeEntrada[0].unidad" class="form-select">
                            <option value="KILOGRAMOS">Kilogramos</option>
                            <option value="UNIDADES">Unidades</option>
                            <option value="LITROS">Litros</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción del Bien</label>
                    <input type="text" name="bienesDeEntrada[0].descripcion" placeholder="Ej: Paquetes de arroz 1kg" class="form-control" required>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Subcategoría</label>
                        <input type="text" name="bienesDeEntrada[0].subcategoria.nombre" placeholder="arroz" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">ID Categoría</label>
                        <input type="number" name="bienesDeEntrada[0].subcategoria.categoria.id" value="1" class="form-control" required>
                    </div>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Cantidad Original</label>
                        <input type="number" name="bienesDeEntrada[0].cantidadOriginal" placeholder="2" class="form-control" min="1" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Fecha de Vencimiento (Si corresponde)</label>
                        <input type="date" name="bienesDeEntrada[0].fechaVencimiento" class="form-control">
                    </div>
                </div>

                <button type="submit" class="btn btn-success mt-3">Registrar Donación</button>
                <a th:href="@{/donaciones(idDonante=${idDonanteSeleccionado})}" class="btn btn-secondary mt-3">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
