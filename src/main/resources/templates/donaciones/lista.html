<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="container py-4">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Donaciones por Donante</h2>
    <div>
        <a th:href="@{/donantes}" class="btn btn-outline-secondary me-2">Volver a Donantes</a>
        <a th:if="${idDonanteSeleccionado != null}" th:href="@{/donaciones/nueva(idDonante=${idDonanteSeleccionado})}" class="btn btn-primary">+ Registrar Donación</a>
    </div>
</div>

<!-- Selector de Donante -->
<div class="card mb-4">
    <div class="card-body">
        <form th:action="@{/donaciones}" method="get" class="row align-items-center">
            <div class="col-auto">
                <label class="form-label mb-0 fw-bold">Seleccionar Donante:</label>
            </div>
            <div class="col-md-6">
                <select name="idDonante" class="form-select" onchange="this.form.submit()">
                    <option value="">-- Seleccionar un donante --</option>
                    <option th:each="d : ${donantes}"
                            th:value="${d.id}"
                            th:text="${d.persona != null ? (d.persona instanceof T(org.example.donacionesfrontend.dominio.donante.PersonaHumana) ? d.persona.nombre : d.persona.razonSocial) : 'Donante #' + d.id}"
                            th:selected="${d.id == idDonanteSeleccionado}">
                    </option>
                </select>
            </div>
        </form>
    </div>
</div>

<!-- Tabla de Donaciones -->
<table th:if="${idDonanteSeleccionado != null}" class="table table-striped table-bordered align-middle">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Descripción General</th>
        <th>Bienes Aportados</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(donaciones)}">
        <td colspan="4" class="text-center text-muted">Este donante no registra donaciones cargadas.</td>
    </tr>
    <tr th:each="don : ${donaciones}">
        <td th:text="${don.id}">1</td>
        <!-- CORREGIDO: descripcionGeneral -->
        <td th:text="${don.descripcionGeneral}">Donación alimentos</td>
        <td>
            <ul th:if="${!#lists.isEmpty(don.bienesDeEntrada)}" class="mb-0 ps-3">
                <li th:each="b : ${don.bienesDeEntrada}">
                    <strong th:text="${b.descripcion}">Arroz</strong>
                    (<span th:text="${b.cantidadOriginal != null ? b.cantidadOriginal : b.cantidadActual}">50</span>
                    <span th:text="${b.unidad}">KILOGRAMOS</span>)
                    <span class="badge bg-secondary ms-1" th:if="${b.subcategoria != null}" th:text="${b.subcategoria.nombre}">Alimentos</span>
                </li>
            </ul>
            <span th:if="${#lists.isEmpty(don.bienesDeEntrada)}" class="text-muted">Sin bienes registrados</span>
        </td>
        <td>
            <form th:action="@{/donaciones/eliminar}" method="post" onsubmit="return confirm('¿Eliminar donación?');">
                <input type="hidden" name="idDonante" th:value="${idDonanteSeleccionado}"/>
                <input type="hidden" name="idDonacion" th:value="${don.id}"/>
                <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
