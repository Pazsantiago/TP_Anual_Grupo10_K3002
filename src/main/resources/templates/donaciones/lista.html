<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Listado de donaciones')}"></head>
<body class="container py-4">
<header th:replace="~{fragments/organisms :: encabezado('donaciones')}"></header>

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gestión de Donaciones</h2>
    <a th:href="@{/donaciones/nueva(idDonante=${idDonanteSeleccionado})}" class="btn btn-primary">+ Nueva Donación</a>
</div>

<div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<form method="get" th:action="@{/donaciones}" class="card card-body mb-4 bg-light">
    <div class="row align-items-end">
        <div class="col-md-8">
            <label for="selectDonante" class="form-label fw-bold">Seleccionar Donante:</label>
            <select id="selectDonante" name="idDonante" class="form-select" onchange="this.form.submit()">
                <option value="" disabled th:selected="${idDonanteSeleccionado == null}">-- Seleccionar Donante --</option>
                <option th:each="d : ${donantes}"
                        th:value="${d.id}"
                        th:text="${d.nombre}"
                        th:selected="${d.id == idDonanteSeleccionado}">
                </option>
            </select>
        </div>
        <div class="col-md-4" th:if="${idDonanteSeleccionado != null}">
            <a th:href="@{/donaciones/segmentadas(idDonante=${idDonanteSeleccionado})}" class="btn btn-outline-info w-100">
                Ver Donaciones Segmentadas
            </a>
        </div>
    </div>
</form>

<div th:if="${idDonanteSeleccionado != null}">
    <div class="table-responsive bg-white rounded shadow-sm border">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Fecha Entrada</th>
                <th>Cant. Bienes</th>
                <th>Categorías Incluidas</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="don : ${donaciones}">
                <td th:text="${don.id}">1</td>
                <td th:text="${#dates.format(don.fechaEntrada, 'dd/MM/yyyy HH:mm')}">01/10/2026</td>
                <td th:text="${don.cantBienes}">5</td>
                <td>
                    <span th:each="cat : ${don.categoriasIncluidas}" class="badge bg-secondary me-1" th:text="${cat}">Alimentos</span>
                    <span th:if="${don.categoriasIncluidas == null or #lists.isEmpty(don.categoriasIncluidas)}" class="text-muted">General</span>
                </td>
                <td class="text-end">
                    <form method="post" th:action="@{/donaciones/eliminar}" onsubmit="return confirm('¿Seguro deseas eliminar esta donación?');" style="display:inline;">
                        <input type="hidden" name="idDonante" th:value="${idDonanteSeleccionado}"/>
                        <input type="hidden" name="idDonacion" th:value="${don.id}"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${donaciones == null or #lists.isEmpty(donaciones)}">
                <td colspan="5" class="text-center py-4 text-muted">No hay donaciones registradas para el donante seleccionado.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:if="${idDonanteSeleccionado == null}" class="alert alert-info text-center">
    Por favor, selecciona un donante para ver e interactuar con sus donaciones.
</div>

</body>
</html>
