<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ver segmentadas con filtros')}"></head>
<body>

<header th:replace="~{fragments/organisms :: encabezado('donaciones')}"></header>

<main id="contenido" class="container page">
    <header class="page-head">
        <h1 class="page-head__title">Donaciones Segmentadas en Depósito</h1>
    </header>

    <div th:replace="~{fragments/molecules :: mensajes}"></div>

    <section class="card form form--wide mb-4">
        <div class="field-row">
            <div class="field">
                <label class="field__label" for="filterEstado">Filtrar por Estado:</label>
                <select id="filterEstado" class="field__control" onchange="filtrarTabla()">
                    <option value="">-- Todos los Estados --</option>
                    <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
                </select>
            </div>

            <div class="field">
                <label class="field__label" for="filterCategoria">Filtrar por Categoría:</label>
                <select id="filterCategoria" class="field__control" onchange="filtrarTabla()">
                    <option value="">-- Todas las Categorías --</option>
                    <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}"></option>
                </select>
            </div>

            <div class="field">
                <label class="field__label" for="filterSubcategoria">Filtrar por Subcategoría:</label>
                <select id="filterSubcategoria" class="field__control" onchange="filtrarTabla()">
                    <option value="">-- Todas las Subcategorías --</option>
                    <option th:each="sub : ${subcategorias}" th:value="${sub}" th:text="${sub}"></option>
                </select>
            </div>
        </div>
    </section>

    <div class="table-wrap" role="region" aria-label="Tabla de Donaciones Segmentadas" tabindex="0">
        <table class="table" id="tablaSegmentadas">
            <thead>
            <tr>
                <th scope="col">ID Segmentada</th>
                <th scope="col">Categoría</th>
                <th scope="col">Subcategoría</th>
                <th scope="col">Cant. Actual / Original</th>
                <th scope="col">Estado</th>
                <th scope="col">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${segmentadas}"
                th:data-estado="${s.estadoActual}"
                th:data-categoria="${s.categoria}"
                th:data-subcategoria="${s.subcategoria}">
                <td th:text="'#' + ${s.idSegmentada}">#1</td>
                <td th:text="${s.categoria != null ? s.categoria : 'N/A'}">Alimentos</td>
                <td th:text="${s.subcategoria != null ? s.subcategoria : 'N/A'}">Lácteos</td>
                <td th:text="${s.cantidadActual} + ' / ' + ${s.cantidadOriginal} + ' ' + ${s.unidad}">10 / 10 UNIDADES</td>
                <td>
                    <span th:replace="~{fragments/atoms :: badge-estado(${s.estadoActual})}"></span>
                </td>
                <td>
                    <div class="cluster" th:if="${session.userRol != null and (#strings.toUpperCase(session.userRol) == 'ADMIN' or #strings.toUpperCase(session.userRol) == 'ROLE_ADMIN')}">
                        <a th:href="@{/donaciones/vencidas(idDonante=${idDonanteSeleccionado}, idDonacion=1, idSegmentada=${s.idSegmentada})}"
                           class="btn btn--secondary">
                            Marcar Vencida
                        </a>
                    </div>
                </td>
            </tr>
            <tr th:if="${segmentadas == null or #lists.isEmpty(segmentadas)}">
                <td colspan="6">
                    <div th:replace="~{fragments/molecules :: estado-vacio('No se encontraron donaciones segmentadas.')}"></div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script>
    function filtrarTabla() {
        const estado = document.getElementById('filterEstado').value.toLowerCase();
        const cat = document.getElementById('filterCategoria').value.toLowerCase();
        const sub = document.getElementById('filterSubcategoria').value.toLowerCase();

        const filas = document.querySelectorAll('#tablaSegmentadas tbody tr');

        filas.forEach(fila => {
            const rowEstado = (fila.getAttribute('data-estado') || '').toLowerCase();
            const rowCat = (fila.getAttribute('data-categoria') || '').toLowerCase();
            const rowSub = (fila.getAttribute('data-subcategoria') || '').toLowerCase();

            const matchEstado = !estado || rowEstado === estado;
            const matchCat = !cat || rowCat === cat;
            const matchSub = !sub || rowSub === sub;

            if (matchEstado && matchCat && matchSub) {
                fila.style.display = '';
            } else {
                fila.style.display = 'none';
            }
        });
    }
</script>

<footer th:replace="~{fragments/organisms :: pie}"></footer>
</body>
</html>
