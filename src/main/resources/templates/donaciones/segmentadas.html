<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ver segmentadas con filtros')}"></head>
<body class="container py-4">
<header th:replace="~{fragments/organisms :: encabezado('donaciones')}"></header>
<h2 class="mb-4">Donaciones Segmentadas en Depósito</h2>

<div class="card card-body mb-4 bg-light shadow-sm">
    <div class="row g-3">
        <div class="col-md-4">
            <label class="form-label fw-bold">Filtrar por Estado:</label>
            <select id="filterEstado" class="form-select" onchange="filtrarTabla()">
                <option value="">-- Todos los Estados --</option>
                <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label fw-bold">Filtrar por Categoría:</label>
            <select id="filterCategoria" class="form-select" onchange="filtrarTabla()">
                <option value="">-- Todas las Categorías --</option>
                <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}"></option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label fw-bold">Filtrar por Subcategoría:</label>
            <select id="filterSubcategoria" class="form-select" onchange="filtrarTabla()">
                <option value="">-- Todas las Subcategorías --</option>
                <option th:each="sub : ${subcategorias}" th:value="${sub}" th:text="${sub}"></option>
            </select>
        </div>
    </div>
</div>

<div class="table-responsive bg-white rounded shadow-sm border">
    <table class="table table-hover align-middle mb-0" id="tablaSegmentadas">
        <thead class="table-dark">
        <tr>
            <th>ID Segmentada</th>
            <th>Categoría</th>
            <th>Subcategoría</th>
            <th>Cant. Actual / Original</th>
            <th>Estado</th>
            <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${segmentadas}"
            th:data-estado="${s.estadoActual}"
            th:data-categoria="${s.categoria}"
            th:data-subcategoria="${s.subcategoria}">
            <td class="fw-bold" th:text="'#' + ${s.idSegmentada}">#1</td>
            <td th:text="${s.categoria != null ? s.categoria : 'N/A'}">Alimentos</td>
            <td th:text="${s.subcategoria != null ? s.subcategoria : 'N/A'}">Lácteos</td>
            <td th:text="${s.cantidadActual} + ' / ' + ${s.cantidadOriginal} + ' ' + ${s.unidad}">10 / 10 UNIDADES</td>
            <td>
                <span class="badge bg-success" th:text="${s.estadoActual}">EN_DEPOSITO</span>
            </td>
            <td class="text-end" th:if="${session.userRol != null and (#strings.toUpperCase(session.userRol) == 'ADMIN' or #strings.toUpperCase(session.userRol) == 'ROLE_ADMIN')}">
                <a th:href="@{/donaciones/vencidas(idDonante=${idDonanteSeleccionado}, idDonacion=1, idSegmentada=${s.idSegmentada})}"
                   class="btn btn-sm btn-outline-warning">
                    Marcar Vencida
                </a>
            </td>
        </tr>
        <tr th:if="${segmentadas == null or #lists.isEmpty(segmentadas)}">
            <td colspan="6" class="text-center py-4 text-muted">No se encontraron donaciones segmentadas.</td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    function filtrarTabla() {
        const estado = document.getElementById('filterEstado').value.toLowerCase();
        const cat = document.getElementById('filterCategoria').value.toLowerCase();
        const sub = document.getElementById('filterSubcategoria').value.toLowerCase();

        const filas = document.querySelectorAll('#tablaSegmentadas tbody tr');

        filas.forEach(fila => {
            const rowEstado = (fila.getAttribute('data-estado') || '').toLowerCase();
            const rowCat = (fila.getAttribute('data-categoria') || '').toLowerCase();
            const rowSub = (fila.getAttribute('data-subcategoria') || '').toLowerCase();

            const matchEstado = !estado || rowEstado === estado;
            const matchCat = !cat || rowCat === cat;
            const matchSub = !sub || rowSub === sub;

            if (matchEstado && matchCat && matchSub) {
                fila.style.display = '';
            } else {
                fila.style.display = 'none';
            }
        });
    }
</script>
</body>
</html>
