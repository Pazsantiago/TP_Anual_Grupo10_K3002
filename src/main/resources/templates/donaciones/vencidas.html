<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Indicar vencimiento de donacion')}"></head>
<body>

<header th:replace="~{fragments/organisms :: encabezado('donaciones')}"></header>

<main id="contenido" class="container page" style="max-width: var(--form-max);">
    <header class="page-head">
        <h1 class="page-head__title">Actualizar Estado de Donación Segmentada</h1>
    </header>

    <div th:replace="~{fragments/molecules :: mensajes}"></div>
    <p class="banner banner--error" role="alert" th:if="${error}" th:text="${error}"></p>

    <section class="card">
        <div class="field" style="margin-bottom: var(--space-4);">
            <label class="field__label" for="selectDonante">1. Seleccionar Donante:</label>
            <select id="selectDonante" class="field__control" onchange="location.href='/donaciones/vencidas?idDonante=' + this.value">
                <option value="" disabled th:selected="${idDonanteSeleccionado == null}">-- Seleccionar Donante --</option>
                <option th:each="d : ${donantes}"
                        th:value="${d.id}"
                        th:text="${d.nombre}"
                        th:selected="${d.id == idDonanteSeleccionado}">
                </option>
            </select>
        </div>

        <form class="form" th:if="${idDonanteSeleccionado != null}" th:action="@{/donaciones/vencidas}" method="post">
            <input type="hidden" name="idDonante" th:value="${idDonanteSeleccionado}"/>

            <fieldset class="fieldset">
                <legend class="fieldset__legend">Detalles del Lote</legend>
                <div class="field">
                    <label class="field__label" for="idDonacion">2. ID Donación Original Padre <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                    <input class="field__control" type="number" id="idDonacion" name="idDonacion" placeholder="Ej: 10" required />
                    <p class="field__hint">Ingresá el ID de la donación general a la que pertenece este lote.</p>
                </div>

                <div class="field">
                    <label class="field__label" for="idDonacionSegmentada">3. Lote Segmentado de este Donante <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                    <select id="idDonacionSegmentada" name="idDonacionSegmentada" class="field__control" required th:disabled="${#lists.isEmpty(segmentadas)}">
                        <option value="" disabled selected>-- Seleccionar Lote Segmentado --</option>
                        <option th:each="seg : ${segmentadas}"
                                th:value="${seg.idSegmentada}"
                                th:text="'Lote #' + ${seg.idSegmentada} + ' - ' + ${seg.subcategoria} + ' (' + ${seg.cantidadActual} + ' ' + ${seg.unidad} + ') - Estado: ' + ${seg.estadoActual}">
                        </option>
                    </select>
                </div>
            </fieldset>

            <div class="cluster">
                <button type="submit" class="btn btn--danger">Marcar como Vencida</button>
                <a th:href="@{/donaciones}" class="btn btn--secondary">Cancelar</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/organisms :: pie}"></footer>
</body>
</html>
