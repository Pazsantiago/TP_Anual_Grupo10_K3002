<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dar de alta a un usuario como administrador')}"></head>
<body class="bg-light">
<div class="container py-4" style="max-width: 600px;">
    <div class="mb-3">
        <a th:href="@{/donantes}" class="text-decoration-none">&larr; Volver a donantes</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="card-title mb-2">Registrar donante</h3>
            <p class="text-muted small mb-3">
                Cargá los datos de la persona que llegó al depósito. Antes de registrarla, buscá si ya tiene usuario.
                Al guardar, recibirá un correo de bienvenida para acceder por primera vez.
            </p>

            <!-- Alerta de Error -->
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/donantes/nuevo}" th:object="${donante}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-bold">Tipo de donante *</label>
                    <select th:field="*{tipo}" class="form-select" required>
                        <option value="HUMANA" th:selected="${tipoActual == 'HUMANA'}">Persona Humana</option>
                        <option value="JURIDICA" th:selected="${tipoActual == 'JURIDICA'}">Persona Jurídica</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre / Razón Social *</label>
                    <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej. Ana Pérez o Empresa S.A." required/>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Documento / CUIT *</label>
                    <input type="text" th:field="*{documento}" class="form-control" placeholder="Ej. DNI 12345678 o CUIT 30-12345678-9" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Teléfono de contacto</label>
                    <input type="text" th:field="*{telefono}" class="form-control" placeholder="Ej. +54 11 5555-5555"/>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Correo electrónico *</label>
                    <input type="email" name="email" class="form-control" placeholder="correo@ejemplo.com" required/>
                    <div class="form-text">A esta dirección se enviará el correo con las credenciales de acceso.</div>
                </div>

                <div class="d-flex justify-content-between pt-3">
                    <a th:href="@{/donantes}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Registrar donante</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
