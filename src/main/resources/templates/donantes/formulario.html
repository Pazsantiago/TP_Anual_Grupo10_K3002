<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<h2 class="mb-4">Registrar Donante</h2>

<form th:action="@{/donantes/nuevo}" th:object="${donante}" method="post">

    <div class="mb-3">
        <label class="form-label fw-bold">Tipo de Persona</label>
        <select class="form-select" id="comboTipoPersona" onchange="location = this.value;">
            <option th:value="@{/donantes/nuevo(tipo='HUMANA')}" th:selected="${tipoActual == 'HUMANA'}">Persona Humana</option>
            <option th:value="@{/donantes/nuevo(tipo='JURIDICA')}" th:selected="${tipoActual == 'JURIDICA'}">Persona Jurídica</option>
        </select>
    </div>


    <div th:if="${tipoActual == 'HUMANA'}" class="border p-3 mb-3 rounded bg-white">
        <h5>Datos de Persona Humana</h5>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" name="persona.nombre" required />
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Tipo Documento</label>
                <select class="form-select" name="persona.documento.tipoDoc">
                    <option value="DNI">DNI</option>
                    <option value="PASAPORTE">Pasaporte</option>
                    <option value="CUIL">CUIL</option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Número Documento</label>
                <input type="text" class="form-control" name="persona.documento.numeroDoc" required />
            </div>
        </div>
    </div>

    <div th:if="${tipoActual == 'JURIDICA'}" class="border p-3 mb-3 rounded bg-white">
        <h5>Datos de Persona Jurídica</h5>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Razón Social</label>
                <input type="text" class="form-control" name="persona.razonSocial" required />
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Rubro</label>
                <input type="text" class="form-control" name="persona.rubro" required />
            </div>
        </div>
    </div>

    <div class="border p-3 mb-3 rounded bg-white">
        <h5>Dirección</h5>
        <div class="row">
            <div class="col-md-6 mb-2">
                <label class="form-label">Calle</label>
                <input type="text" class="form-control" name="persona.direccion.calle" />
            </div>
            <div class="col-md-3 mb-2">
                <label class="form-label">Altura</label>
                <input type="number" class="form-control" name="persona.direccion.altura" />
            </div>
            <div class="col-md-3 mb-2">
                <label class="form-label">Localidad</label>
                <input type="text" class="form-control" name="persona.direccion.localidad" />
            </div>
        </div>
    </div>
    <div class="border p-3 mb-3 rounded bg-white">
        <h5>Medio de Contacto Predeterminado</h5>
        <div class="mb-3">
            <label class="form-label">Contacto (Email / Teléfono)</label>
            <input type="text" class="form-control" name="mediosDeContacto[0].valorContacto" placeholder="ejemplo@correo.com o +54911..." required />
        </div>
    </div>

    <div class="d-flex justify-content-between">
        <a th:href="@{/donantes}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-success">Guardar Donante</button>
    </div>
</form>
</body>
</html>
