<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Darse de alta como donante')}"></head>
<head th:replace="~{fragments/layout :: head('Registrar Donante')}"></head>
<body>

<header th:replace="~{fragments/organisms :: encabezado('donantes')}"></header>

<main id="contenido" class="container page" style="max-width: var(--form-max);">
    <header class="page-head">
        <h1 class="page-head__title">Registrar Donante</h1>
    </header>

    <div th:replace="~{fragments/molecules :: mensajes}"></div>
    <p class="banner banner--error" role="alert" th:if="${error}" th:text="${error}"></p>

    <section class="card">
        <fieldset class="fieldset" style="margin-bottom: var(--space-3);">
            <legend class="fieldset__legend">Tipo de Donante</legend>
            <div class="cluster">
                <button type="button" id="btnHumana" class="btn" onclick="seleccionarTipoPersona('HUMANA')">
                    Persona Humana
                </button>
                <button type="button" id="btnJuridica" class="btn btn--secondary" onclick="seleccionarTipoPersona('JURIDICA')">
                    Persona Jurídica
                </button>
            </div>
        </fieldset>

        <form class="form" th:action="@{${session.userRol != null and #strings.contains(session.userRol, 'ADMIN') ? '/donantes/nuevo/admin' : '/donantes/nuevo'}}"
              th:object="${donante}" method="post" id="formDonante">

            <input type="hidden" id="personaTipo" th:field="*{persona.tipo}" value="HUMANA" />

            <!-- Persona Humana -->
            <fieldset id="seccionHumana" class="fieldset">
                <legend class="fieldset__legend">Datos de Persona Humana</legend>
                <div class="field">
                    <label class="field__label" for="nombreHumano">Nombre Completo <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                    <input class="field__control campo-humana" id="nombreHumano" type="text" th:field="*{persona.nombre}" placeholder="Ej. Ana Pérez" required/>
                </div>
                <div class="field-row">
                    <div class="field">
                        <label class="field__label" for="edadHumano">Edad</label>
                        <input class="field__control campo-humana" id="edadHumano" type="number" th:field="*{persona.edad}" min="0" max="120" placeholder="30"/>
                    </div>
                    <div class="field">
                        <label class="field__label" for="generoHumano">Género</label>
                        <select class="field__control campo-humana" id="generoHumano" th:field="*{persona.genero}">
                            <option value="MASCULINO">Masculino</option>
                            <option value="FEMENINO">Femenino</option>
                            <option value="NO_BINARIO">No binario</option>
                            <option value="PREFIERO_NO_DECIR">Prefiero no decir</option>
                        </select>
                    </div>
                </div>
            </fieldset>

            <!-- Persona Jurídica (Oculta por defecto) -->
            <fieldset id="seccionJuridica" class="fieldset" style="display: none;">
                <legend class="fieldset__legend">Datos de Persona Jurídica</legend>
                <div class="field">
                    <label class="field__label" for="razonSocialJuridica">Razón Social <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                    <input class="field__control campo-juridica" id="razonSocialJuridica" type="text" th:field="*{persona.razonSocial}" placeholder="Ej. Empresa S.A." disabled required/>
                </div>
                <div class="field-row">
                    <div class="field">
                        <label class="field__label" for="tipoJuridicaSelect">Tipo Jurídico</label>
                        <select class="field__control campo-juridica" id="tipoJuridicaSelect" th:field="*{persona.tipoJuridica}" disabled>
                            <option value="ONG">ONG</option>
                            <option value="EMPRESA">Empresa</option>
                            <option value="GUBERNAMENTAL">Gubernamental</option>
                            <option value="INSTITUCION">Institución</option>
                        </select>
                    </div>
                    <div class="field">
                        <label class="field__label" for="rubroJuridico">Rubro</label>
                        <input class="field__control campo-juridica" id="rubroJuridico" type="text" th:field="*{persona.rubro}" placeholder="Ej. Logística" disabled/>
                    </div>
                </div>
            </fieldset>

            <!-- Documentación -->
            <fieldset class="fieldset">
                <legend class="fieldset__legend">Documentación</legend>
                <div class="field-row">
                    <div class="field">
                        <label class="field__label" for="tipoDocSelect">Tipo Documento <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                        <select class="field__control" id="tipoDocSelect" th:field="*{persona.documento.tipoDocumento}" required>
                            <option value="DNI">DNI</option>
                            <option value="CUIT">CUIT</option>
                            <option value="PASAPORTE">Pasaporte</option>
                        </select>
                    </div>
                    <div class="field">
                        <label class="field__label" for="numDocInput">Número de Documento <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                        <input class="field__control" id="numDocInput" type="text" th:field="*{persona.documento.documento}" placeholder="Ej. 12345678" required/>
                    </div>
                </div>
            </fieldset>

            <!-- Domicilio -->
            <fieldset class="fieldset">
                <legend class="fieldset__legend">Domicilio</legend>
                <div class="field-row">
                    <div class="field">
                        <label class="field__label" for="calleInput">Calle</label>
                        <input class="field__control" id="calleInput" type="text" th:field="*{persona.direccion.calle}" placeholder="Av. Corrientes"/>
                    </div>
                    <div class="field">
                        <label class="field__label" for="alturaInput">Altura</label>
                        <input class="field__control" id="alturaInput" type="number" th:field="*{persona.direccion.altura}" placeholder="1234"/>
                    </div>
                </div>
                <div class="field-row">
                    <div class="field">
                        <label class="field__label" for="localidadInput">Localidad</label>
                        <input class="field__control" id="localidadInput" type="text" th:field="*{persona.direccion.localidad}" placeholder="CABA"/>
                    </div>
                    <div class="field">
                        <label class="field__label" for="cpInput">Código Postal</label>
                        <input class="field__control" id="cpInput" type="text" th:field="*{persona.direccion.codigoPostal}" placeholder="C1043"/>
                    </div>
                </div>
            </fieldset>

            <!-- Contacto -->
            <fieldset class="fieldset">
                <legend class="fieldset__legend">Contacto de Notificación</legend>
                <div class="field-row">
                    <div class="field">
                        <label class="field__label" for="tipoContactoSelect">Canal de Notificación</label>
                        <select class="field__control" id="tipoContactoSelect" th:field="*{mediosDeContacto[0].tipo}">
                            <option value="EMAIL">Email</option>
                            <option value="SMS">SMS</option>
                            <option value="WHATSAPP">WhatsApp</option>
                        </select>
                    </div>
                    <div class="field">
                        <label class="field__label" for="telContactoInput">Teléfono de Contacto</label>
                        <input class="field__control" id="telContactoInput" type="text" th:field="*{mediosDeContacto[0].telefono}" placeholder="+54 11 5555-5555"/>
                    </div>
                </div>
                <input type="hidden" name="mediosDeContacto[0].esPredeterminado" value="true"/>
            </fieldset>

            <!-- Cuenta de Usuario -->
            <fieldset class="fieldset">
                <legend class="fieldset__legend">Cuenta de Usuario</legend>
                <div class="field-row">
                    <div class="field">
                        <label class="field__label" for="emailKeycloak">Correo electrónico (Usuario) <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                        <input class="field__control" id="emailKeycloak" type="email" name="email" placeholder="usuario@ejemplo.com" required/>
                    </div>
                    <div class="field" th:unless="${session.userRol != null and #strings.contains(session.userRol, 'ADMIN')}">
                        <label class="field__label" for="passKeycloak">Contraseña <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                        <input class="field__control" id="passKeycloak" type="password" name="password" placeholder="******"
                               th:required="${session.userRol == null or !#strings.contains(session.userRol, 'ADMIN')}" minlength="6"/>
                    </div>
                </div>
            </fieldset>

            <div class="cluster">
                <button class="btn" type="submit">Guardar Donante</button>
                <a class="btn btn--secondary" th:href="@{/donantes}">Cancelar</a>
            </div>
        </form>
    </section>
</main>

<script>
    function seleccionarTipoPersona(tipo) {
        document.getElementById('personaTipo').value = tipo;

        const seccionHumana = document.getElementById('seccionHumana');
        const seccionJuridica = document.getElementById('seccionJuridica');
        const btnHumana = document.getElementById('btnHumana');
        const btnJuridica = document.getElementById('btnJuridica');

        const camposHumana = document.querySelectorAll('.campo-humana');
        const camposJuridica = document.querySelectorAll('.campo-juridica');

        if (tipo === 'JURIDICA') {
            seccionHumana.style.display = 'none';
            seccionJuridica.style.display = 'grid';

            btnHumana.className = 'btn btn--secondary';
            btnJuridica.className = 'btn';

            camposHumana.forEach(el => el.disabled = true);
            camposJuridica.forEach(el => el.disabled = false);
        } else {
            seccionHumana.style.display = 'grid';
            seccionJuridica.style.display = 'none';

            btnHumana.className = 'btn';
            btnJuridica.className = 'btn btn--secondary';

            camposHumana.forEach(el => el.disabled = false);
            camposJuridica.forEach(el => el.disabled = true);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const tipoInicial = document.getElementById('personaTipo').value || 'HUMANA';
        seleccionarTipoPersona(tipoInicial);
    });
</script>

<footer th:replace="~{fragments/organisms :: pie}"></footer>
</body>
</html>
