<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container col-md-6">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 th:text="${donante.id == null ? 'Nuevo Donante' : 'Editar Donante'}">Donante</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/donantes}" th:object="${donante}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-bold">Tipo de Donante</label>
                    <select class="form-select" onchange="location.href='?tipo=' + this.value">
                        <option value="HUMANA" th:selected="${donante.persona instanceof T(org.example.donacionesfrontend.dominio.donante.PersonaHumana)}">Persona Humana</option>
                        <option value="JURIDICA" th:selected="${donante.persona instanceof T(org.example.donacionesfrontend.dominio.donante.PersonaJuridica)}">Persona Jurídica</option>
                    </select>
                </div>


                <div th:if="${donante.persona instanceof T(org.example.donacionesfrontend.dominio.donante.PersonaHumana)}">
                    <h5 class="text-primary mb-3">Datos de Persona Humana</h5>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre</label>
                            <input type="text" th:field="*{persona.nombre}" class="form-control" placeholder="Ej: Santiago" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Apellido</label>
                            <input type="text" th:field="*{persona.apellido}" class="form-control" placeholder="Ej: Pérez">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Edad</label>
                            <input type="number" th:field="*{persona.edad}" class="form-control" placeholder="Ej: 30">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Género</label>
                            <select th:field="*{persona.genero}" class="form-select">
                                <option value="MASCULINO">Masculino</option>
                                <option value="FEMENINO">Femenino</option>
                                <option value="NO_BINARIO">No Binario</option>
                                <option value="PREFIERO_NO_DECIR">Prefiero no decir</option>
                            </select>
                        </div>
                    </div>

                    <h6>Documento</h6>
                    <div class="row g-2 mb-3">
                        <div class="col-md-4">
                            <select th:field="*{persona.documento.tipoDocumento}" class="form-select">
                                <option value="DNI">DNI</option>
                                <option value="PASAPORTE">Pasaporte</option>
                                <option value="LE">LE</option>
                                <option value="LC">LC</option>
                            </select>
                        </div>
                        <div class="col-md-8">
                            <input type="text" th:field="*{persona.documento.documento}" class="form-control" placeholder="30-58644047-7" required>
                        </div>
                    </div>
                </div>

                <div th:if="${donante.persona instanceof T(org.example.donacionesfrontend.dominio.donante.PersonaJuridica)}">
                    <h5 class="text-primary mb-3">Datos de Persona Jurídica</h5>
                    <div class="mb-3">
                        <label class="form-label">Razón Social</label>
                        <input type="text" th:field="*{persona.razonSocial}" class="form-control" placeholder="Ej: Arcos Plateados S.A." required>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Rubro</label>
                            <input type="text" th:field="*{persona.rubro}" class="form-control" placeholder="Ej: Alimentos">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Tipo Jurídico</label>
                            <select th:field="*{persona.tipoJuridica}" class="form-select">
                                <option value="EMPRESA">Empresa</option>
                                <option value="ONG">ONG</option>
                                <option value="GUBERNAMENTAL">Gubernamental</option>
                                <option value="INSTITUCION">Institución</option>
                            </select>
                        </div>
                    </div>
                </div>


                <h6 class="mt-3">Dirección</h6>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <input type="text" th:field="*{persona.direccion.calle}" class="form-control" placeholder="Calle">
                        </div>
                        <div class="col-md-6">
                            <input type="text" th:field="*{persona.direccion.altura}" class="form-control" placeholder="Altura">
                        </div>
                        <div class="col-md-6">
                            <input type="text" th:field="*{persona.direccion.localidad}" class="form-control" placeholder="Localidad">
                        </div>
                        <div class="col-md-6">
                            <input type="text" th:field="*{persona.direccion.codigoPostal}" class="form-control" placeholder="Código Postal">
                        </div>
                    </div>


                    <h6>Medio de Contacto Predeterminado</h6>
                        <div class="row g-2 mb-3">
                            <div class="col-md-4">
                                <select th:field="*{mediosDeContacto[0].tipo}" class="form-select">
                                    <option value="EMAIL">Correo Electrónico</option>
                                    <option value="WHATSAPP">WhatsApp</option>
                                    <option value="TELEFONO">Teléfono</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <input type="email" th:field="*{mediosDeContacto[0].correoElectronico}" class="form-control" placeholder="correo@ejemplo.com">
                            </div>
                            <div class="col-md-4">
                                <input type="text" th:field="*{mediosDeContacto[0].telefono}" class="form-control" placeholder="+5491123456789">
                            </div>
                            <input type="hidden" th:field="*{mediosDeContacto[0].esPredeterminado}" value="true" />
                        </div>

                        <button type="submit" class="btn btn-success mt-3">Guardar Donante</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
