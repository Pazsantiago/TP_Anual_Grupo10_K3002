<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container col-md-6">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 th:text="${donante.id == null ? 'Nuevo Donante' : 'Editar Donante'}">Donante</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/donantes/nuevo}" th:object="${donante}" method="post" class="card p-4 shadow-sm">

                <input type="hidden" name="tipo" th:value="${donante.persona.class.simpleName == 'PersonaJuridica' ? 'JURIDICA' : 'HUMANA'}" />

                <div class="mb-3">
                    <label class="form-label fw-bold">Tipo de Persona</label>
                    <select class="form-select" onchange="location.href='/donantes/nuevo?tipo=' + this.value">
                        <option value="HUMANA" th:selected="${donante.persona.class.simpleName == 'PersonaHumana'}">Persona Humana</option>
                        <option value="JURIDICA" th:selected="${donante.persona.class.simpleName == 'PersonaJuridica'}">Persona Jurídica</option>
                    </select>
                </div>

                <div th:if="${donante.persona.class.simpleName == 'PersonaHumana'}" class="border p-3 rounded mb-3 bg-light">
                    <h5 class="text-primary mb-3">Datos de Persona Humana</h5>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre</label>
                            <input type="text" name="persona.nombre" th:value="${donante.persona.nombre}" class="form-control" placeholder="Ej: Santiago" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Edad</label>
                            <input type="number" name="persona.edad" th:value="${donante.persona.edad}" class="form-control" placeholder="Ej: 30">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Género</label>
                            <select name="persona.genero" class="form-select">
                                <option value="MASCULINO" th:selected="${donante.persona.genero == 'MASCULINO'}">Masculino</option>
                                <option value="FEMENINO" th:selected="${donante.persona.genero == 'FEMENINO'}">Femenino</option>
                                <option value="NO_BINARIO" th:selected="${donante.persona.genero == 'NO_BINARIO'}">No Binario</option>
                                <option value="PREFIERO_NO_DECIR" th:selected="${donante.persona.genero == 'PREFIERO_NO_DECIR'}">Prefiero no decir</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Tipo Documento</label>
                            <select name="persona.documento.tipoDocumento" class="form-select">
                                <option value="DNI">DNI</option>
                                <option value="PASAPORTE">Pasaporte</option>
                                <option value="CUIL">CUIL</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Número Documento</label>
                            <input type="text" name="persona.documento.documento" th:value="${donante.persona.documento?.documento}" class="form-control" placeholder="30123456" required>
                        </div>
                    </div>
                </div>

                <div th:if="${donante.persona.class.simpleName == 'PersonaJuridica'}" class="border p-3 rounded mb-3 bg-light">
                    <h5 class="text-primary mb-3">Datos de Persona Jurídica</h5>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Razón Social</label>
                            <input type="text" name="persona.razonSocial" th:value="${donante.persona.razonSocial}" class="form-control" placeholder="Ej: Fundación Ayuda SRL" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Rubro</label>
                            <input type="text" name="persona.rubro" th:value="${donante.persona.rubro}" class="form-control" placeholder="Ej: Alimenticio">
                        </div>
                    </div>
                </div>

                <h5 class="mt-2">Dirección</h5>
                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Calle</label>
                        <input type="text" name="persona.direccion.calle" th:value="${donante.persona.direccion?.calle}" class="form-control" placeholder="Av. Medrano">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Altura</label>
                        <input type="text" name="persona.direccion.altura" th:value="${donante.persona.direccion?.altura}" class="form-control" placeholder="951">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Localidad</label>
                        <input type="text" name="persona.direccion.localidad" th:value="${donante.persona.direccion?.localidad}" class="form-control" placeholder="CABA">
                    </div>
                </div>
                
                <h5 class="mt-2">Medio de Contacto</h5>
                <div class="row g-2 mb-3" th:each="m, iter : ${donante.mediosDeContacto}">
                    <input type="hidden" th:name="'mediosDeContacto[' + ${iter.index} + '].esPredeterminado'" value="true" />
                    <div class="col-md-4">
                        <label class="form-label">Tipo Contacto</label>
                        <select th:name="'mediosDeContacto[' + ${iter.index} + '].tipo'" class="form-select">
                            <option value="EMAIL">Email</option>
                            <option value="WHATSAPP">WhatsApp</option>
                            <option value="TELEFONO">Teléfono</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" th:name="'mediosDeContacto[' + ${iter.index} + '].correoElectronico'" class="form-control" placeholder="contacto@ejemplo.com">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Teléfono</label>
                        <input type="text" th:name="'mediosDeContacto[' + ${iter.index} + '].telefono'" class="form-control" placeholder="+5491123456789">
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="/donantes" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar Donante</button>
                </div>

            </form>
        </div>
    </div>
</div>
</body>
</html>
