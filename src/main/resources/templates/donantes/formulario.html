<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container col-md-6">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 th:text="${donante.id == null ? 'Nuevo Donante' : 'Editar Donante'}">Donante</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/donantes}" th:object="${donante}" method="post">

                <input type="hidden" name="tipo" th:value="${param.tipo != null ? param.tipo : 'HUMANA'}" />
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Tipo de Persona</label>
                    <select class="form-select" onchange="location.href='/donantes/nuevo?tipo=' + this.value">
                        <option value="HUMANA" th:selected="${param.tipo == null or param.tipo[0] == 'HUMANA'}">Persona Humana</option>
                        <option value="JURIDICA" th:selected="${param.tipo != null and param.tipo[0] == 'JURIDICA'}">Persona Jurídica</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Tipo de Donante</label>
                    <select class="form-select" onchange="location.href='?tipo=' + this.value">
                        <option value="HUMANA" th:selected="${donante.persona.class.simpleName == 'PersonaHumana'}">Persona Humana</option>
                        <option value="JURIDICA" th:selected="${donante.persona.class.simpleName == 'PersonaJuridica'}">Persona Jurídica</option>
                    </select>
                </div>

                <div th:if="${donante.persona.class.simpleName == 'PersonaHumana'}" class="border p-3 rounded mb-3 bg-light">
                    <h5 class="text-primary mb-3">Datos de Persona Humana</h5>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre</label>
                            <input type="text" name="persona.nombre" th:value="${donante.persona.nombre}" class="form-control" placeholder="Ej: Santiago" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Edad</label>
                            <input type="number" name="persona.edad" th:value="${donante.persona.edad}" class="form-control" placeholder="Ej: 30">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Género</label>
                            <select name="persona.genero" class="form-select">
                                <option value="MASCULINO" th:selected="${donante.persona.genero == 'MASCULINO'}">Masculino</option>
                                <option value="FEMENINO" th:selected="${donante.persona.genero == 'FEMENINO'}">Femenino</option>
                                <option value="NO_BINARIO" th:selected="${donante.persona.genero == 'NO_BINARIO'}">No Binario</option>
                                <option value="PREFIERO_NO_DECIR" th:selected="${donante.persona.genero == 'PREFIERO_NO_DECIR'}">Prefiero no decir</option>
                            </select>
                        </div>
                    </div>

                    <h6>Documento</h6>
                    <div class="row g-2 mb-3">
                        <div class="col-md-4">
                            <select name="persona.documento.tipoDocumento" class="form-select">
                                <option value="DNI" th:selected="${donante.persona.documento?.tipoDocumento == 'DNI'}">DNI</option>
                                <option value="PASAPORTE" th:selected="${donante.persona.documento?.tipoDocumento == 'PASAPORTE'}">Pasaporte</option>
                                <option value="LE" th:selected="${donante.persona.documento?.tipoDocumento == 'LE'}">LE</option>
                                <option value="LC" th:selected="${donante.persona.documento?.tipoDocumento == 'LC'}">LC</option>
                            </select>
                        </div>
                        <div class="col-md-8">
                            <input type="text" name="persona.documento.documento" th:value="${donante.persona.documento?.documento}" class="form-control" placeholder="30-58644047-7" required>
                        </div>
                    </div>
                </div>

                <div th:if="${donante.persona.class.simpleName == 'PersonaJuridica'}" class="border p-3 rounded mb-3 bg-light">
                    <h5 class="text-primary mb-3">Datos de Persona Jurídica</h5>

                    <div class="mb-3">
                        <label class="form-label">Razón Social</label>
                        <input type="text" name="persona.razonSocial" th:value="${donante.persona.razonSocial}" class="form-control" placeholder="Ej: Arcos Plateados S.A." required>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Rubro</label>
                            <input type="text" name="persona.rubro" th:value="${donante.persona.rubro}" class="form-control" placeholder="Ej: Alimentos">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Tipo Jurídico</label>
                            <select name="persona.tipoJuridica" class="form-select">
                                <option value="EMPRESA" th:selected="${donante.persona.tipoJuridica == 'EMPRESA'}">Empresa</option>
                                <option value="ONG" th:selected="${donante.persona.tipoJuridica == 'ONG'}">ONG</option>
                                <option value="GUBERNAMENTAL" th:selected="${donante.persona.tipoJuridica == 'GUBERNAMENTAL'}">Gubernamental</option>
                                <option value="INSTITUCION" th:selected="${donante.persona.tipoJuridica == 'INSTITUCION'}">Institución</option>
                            </select>
                        </div>
                    </div>

                    <!-- SELECCIÓN DE REPRESENTANTES (PERSONAS HUMANAS REGISTRADAS) -->
                    <div class="mb-3 border-top pt-3">
                        <label class="form-label fw-bold">Representantes Habilitados</label>
                        <small class="form-text text-muted d-block mb-2">Seleccioná a las personas humanas registradas que operan en nombre de la organización:</small>

                        <div th:if="${#lists.isEmpty(personasHumanas)}" class="alert alert-warning py-2 small">
                            No hay personas humanas registradas previamente para asignar como representantes.
                        </div>

                        <div th:each="ph : ${personasHumanas}" class="form-check">
                            <input class="form-check-input" type="checkbox" name="persona.representantes"
                                   th:value="${ph.id}"
                                   th:id="${'rep_' + ph.id}">
                            <label class="form-check-label" th:for="${'rep_' + ph.id}"
                                   th:text="${ph.nombre + ' ' + ph.apellido + ' (Doc: ' + ph.documento?.documento + ')'}">
                            </label>
                        </div>
                    </div>
                </div>


                <h6 class="mt-3">Dirección</h6>
                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <input type="text" name="persona.direccion.calle" th:value="${donante.persona.direccion?.calle}" class="form-control" placeholder="Calle">
                    </div>
                    <div class="col-md-6">
                        <input type="text" name="persona.direccion.altura" th:value="${donante.persona.direccion?.altura}" class="form-control" placeholder="Altura">
                    </div>
                    <div class="col-md-6">
                        <input type="text" name="persona.direccion.localidad" th:value="${donante.persona.direccion?.localidad}" class="form-control" placeholder="Localidad">
                    </div>
                    <div class="col-md-6">
                        <input type="text" name="persona.direccion.codigoPostal" th:value="${donante.persona.direccion?.codigoPostal}" class="form-control" placeholder="Código Postal">
                    </div>
                </div>

                <h6 class="mt-3">Medio de Contacto Predeterminado</h6>
                <div class="row g-2 mb-3">
                    <div class="col-md-4">
                        <select th:field="*{mediosDeContacto[0].tipo}" class="form-select">
                            <option value="EMAIL">Correo Electrónico</option>
                            <option value="WHATSAPP">WhatsApp</option>
                            <option value="TELEFONO">Teléfono</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <input type="email" th:field="*{mediosDeContacto[0].correoElectronico}" class="form-control" placeholder="correo@ejemplo.com">
                    </div>
                    <div class="col-md-4">
                        <input type="text" th:field="*{mediosDeContacto[0].telefono}" class="form-control" placeholder="+5491123456789">
                    </div>
                    <input type="hidden" th:field="*{mediosDeContacto[0].esPredeterminado}" value="true" />
                </div>

                <button type="submit" class="btn btn-success mt-3">Guardar Donante</button>
                <a href="/donantes" class="btn btn-secondary mt-3">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
