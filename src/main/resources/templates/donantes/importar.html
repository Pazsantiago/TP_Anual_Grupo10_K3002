<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Importacion masiva de donantes por csv')}"></head>
<header th:replace="~{fragments/navbar :: encabezado('donaciones')}"></header>

<body class="container py-4 bg-light">



<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0"><i class="bi bi-file-earmark-arrow-up-fill me-2"></i>Importación Masiva de Donantes</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted">Cargá un archivo en formato CSV con los registros de donantes humanos o jurídicos y sus medios de contacto para darlos de alta en forma masiva.</p>
                <div th:if="${exito != null}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${exito}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form th:action="@{/donantes/importador}" method="post" enctype="multipart/form-data" class="card p-4 shadow-sm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Seleccionar archivo CSV de Donantes</label>
                        <input type="file" name="archivo" class="form-control" accept=".csv" required />
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{/home}" class="btn btn-secondary">Volver</a>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-upload me-1"></i> Subir e Importar CSV
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
