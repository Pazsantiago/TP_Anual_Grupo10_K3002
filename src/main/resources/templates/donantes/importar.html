<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Importacion masiva de donantes por csv')}"></head>
<body>

<header th:replace="~{fragments/organisms :: encabezado('donantes')}"></header>

<main id="contenido" class="container page" style="max-width: var(--form-max);">
    <header class="page-head">
        <h1 class="page-head__title">Importación Masiva de Donantes (CSV)</h1>
    </header>

    <div th:replace="~{fragments/molecules :: mensajes}"></div>

    <section class="card">
        <form class="form" th:action="@{/donantes/importador}" method="post" enctype="multipart/form-data">
            <div class="field">
                <label class="field__label" for="archivo">Seleccionar archivo CSV <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                <input class="field__control" type="file" id="archivo" name="archivo" accept=".csv" required/>
            </div>

            <div class="cluster">
                <button type="submit" class="btn">Cargar CSV</button>
                <a th:href="@{/donantes}" class="btn btn--secondary">Volver</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/organisms :: pie}"></footer>
</body>
</html>
