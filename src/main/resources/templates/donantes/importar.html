<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Importacion masiva de donantes por csv')}"></head>
<body class="container py-4">
<header th:replace="~{fragments/organisms :: encabezado('donantes')}"></header>

<h2 class="mb-4">Importación Masiva de Donantes (CSV)</h2>

<div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <form th:action="@{/donantes/importador}" method="post" enctype="multipart/form-data" class="card p-4 shadow-sm border-0">
            <div class="mb-3">
                <label for="archivo" class="form-label fw-bold">Seleccionar archivo CSV</label>
                <input type="file" id="archivo" name="archivo" class="form-control" accept=".csv" required/>
            </div>
            <div class="d-flex justify-content-between pt-2">
                <a th:href="@{/donantes}" class="btn btn-secondary">Volver</a>
                <button type="submit" class="btn btn-primary">Cargar CSV</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
