<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<body class="container py-4">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Donantes Registrados</h2>
    <a th:href="@{/donantes/nuevo}" class="btn btn-primary">+ Nuevo Donante</a>
</div>

<table class="table table-striped table-bordered align-middle">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Nombre / Razón Social</th>
        <th>Contacto</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(donantes)}">
        <td colspan="4" class="text-center text-muted">No hay donantes registrados.</td>
    </tr>
    <tr th:each="d : ${donantes}">
        <td th:text="${d.id}">1</td>
        <td>
            <span th:if="${d.persona != null}" th:text="${d.persona.nombre != null ? d.persona.nombre : d.persona.razonSocial}">Juan Pérez</span>
            <span th:if="${d.persona == null}" class="text-muted">Sin datos</span>
        </td>
        <td>
            <span th:if="${!#lists.isEmpty(d.mediosDeContacto)}" th:text="${d.mediosDeContacto[0].correoElectronico}">contacto@mail.com</span>
            <span th:if="${#lists.isEmpty(d.mediosDeContacto)}" class="text-muted">Sin contacto</span>
        </td>
        <td class="d-flex gap-2">
            <a th:href="@{/donaciones(idDonante=${d.id})}" class="btn btn-sm btn-info text-white">Donaciones</a>
            <form th:action="@{/donantes/eliminar}" method="post" onsubmit="return confirm('¿Eliminar donante?');">
                <input type="hidden" name="id" th:value="${d.id}"/>
                <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>

</html>
