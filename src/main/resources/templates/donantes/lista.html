<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Listado de Donantes')}"></head>
<body class="container py-4">
<header th:replace="~{fragments/navbar :: encabezado('donaciones')}"></header>
<h2 class="mb-4">Gestión de Donantes</h2>

<!-- Mensajes de feedback -->
<div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<!-- Botones de Acción -->
<div class="mb-3 d-flex gap-2">
    <a th:href="@{/donantes/nuevo(tipo='HUMANA')}" class="btn btn-primary">+ Nuevo Donante Humano</a>
    <a th:href="@{/donantes/nuevo(tipo='JURIDICA')}" class="btn btn-secondary">+ Nuevo Donante Jurídico</a>
    <a th:href="@{/donantes/importar}" class="btn btn-outline-info">Importar CSV</a>
    <a th:if="${session.userRol == 'ADMIN' or session.userRol == 'ROLE_ADMIN'}"
       th:href="@{/donantes/nuevo/admin}"
       class="btn btn-primary me-2">
        Registrar donante (Admin)
    </a>
</div>
<!-- Botón visible SOLO para usuarios estándar / donantes (NO Administradores) -->


<!-- Tabla de Donantes -->
<table class="table table-striped table-hover align-middle">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Nombre / Razón Social</th>
        <th>Contacto Predeterminado</th>
        <th>Cant. Donaciones</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="d : ${donantes}">
        <td th:text="${d.id}">1</td>
        <td th:text="${d.nombre}">Juan Pérez</td>
        <td>
                <span th:if="${d.contactoPredeterminado != null}">
                    <strong th:text="${d.contactoPredeterminado.tipo}">EMAIL</strong>:
                    <span th:text="${d.contactoPredeterminado.correoElectronico}">correo@ejemplo.com</span>
                    <span th:if="${d.contactoPredeterminado.telefono}" th:text="'(' + ${d.contactoPredeterminado.telefono} + ')'"></span>
                </span>
            <span th:if="${d.contactoPredeterminado == null}" class="text-muted">Sin contacto</span>
        </td>
        <td th:text="${d.donaciones != null ? d.donaciones.size() : 0}">0</td>
        <td>
            <div class="d-flex gap-2">
                <a th:href="@{/donaciones(idDonante=${d.id})}" class="btn btn-sm btn-info">Ver Donaciones</a>
                <form method="post" th:action="@{/donantes/eliminar}" onsubmit="return confirm('¿Seguro deseas eliminar este donante?');">
                    <input type="hidden" name="id" th:value="${d.id}"/>
                    <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                </form>
            </div>
        </td>
    </tr>
    <tr th:if="${donantes == null or #lists.isEmpty(donantes)}">
        <td colspan="5" class="text-center text-muted">No hay donantes registrados.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
