<!DOCTYPE html>
<html xmlns:th="[suspicious link removed]">
<head>
    <meta charset="UTF-8">
    <title>DonaTrack - Donantes</title>
    <link rel="stylesheet" href="[suspicious link removed]">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Lista de Donantes</h2>
        <a href="/donantes/nuevo" class="btn btn-primary">+ Nuevo Donante</a>
    </div>

    <table class="table table-striped table-hover bg-white shadow-sm rounded">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Tipo Persona</th>
            <th>Nombre / Razón Social</th>
            <th>Contacto</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${donantes}">
            <td th:text="${d.id}">1</td>
            <td th:text="${d.tipoPersona}">HUMANA</td>
            <td th:text="${d.nombre != null ? (d.nombre + ' ' + d.apellido) : d.razonSocial}">Juan Pérez</td>
            <td th:text="${d.correoElectronico + ' / ' + d.telefono}">juan@mail.com</td>
            <td>
                <a th:href="@{/donantes/editar/{id}(id=${d.id})}" class="btn btn-sm btn-warning">Editar</a>
                <form th:action="@{/donantes/eliminar/{id}(id=${d.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar donante?');">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
