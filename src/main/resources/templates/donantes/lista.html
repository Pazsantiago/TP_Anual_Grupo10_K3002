<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="container py-4 bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="table-responsive bg-white rounded shadow-sm border">
    <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Tipo</th>
            <th>Nombre / Razón Social</th>
            <th>Documento / Rubro</th>
            <th>Contacto</th>
            <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(donantes)}">
            <td colspan="6" class="text-center text-muted py-4">No hay donantes registrados en la plataforma.</td>
        </tr>

        <tr th:each="d : ${donantes}">
            <td th:text="${d.id}">1</td>
            <td>
                <span th:if="${d.persona.class.simpleName == 'PersonaHumana'}" class="badge bg-info text-dark">Humana</span>
                <span th:if="${d.persona.class.simpleName == 'PersonaJuridica'}" class="badge bg-warning text-dark">Jurídica</span>
            </td>
            <td>
                <strong th:if="${d.persona.class.simpleName == 'PersonaHumana'}"
                        th:text="${d.persona.nombre + (d.persona.apellido != null ? ' ' + d.persona.apellido : '')}"></strong>
                <strong th:if="${d.persona.class.simpleName == 'PersonaJuridica'}"
                        th:text="${d.persona.razonSocial}"></strong>
            </td>
            <td>
                        <span th:if="${d.persona.class.simpleName == 'PersonaHumana'}"
                              th:text="${d.persona.documento?.tipoDocumento + ': ' + d.persona.documento?.documento}"></span>
                <span th:if="${d.persona.class.simpleName == 'PersonaJuridica'}"
                      th:text="${d.persona.rubro}"></span>
            </td>
            <td>
                        <span th:if="${!#lists.isEmpty(d.mediosDeContacto)}"
                              th:text="${d.mediosDeContacto[0].correoElectronico != null ? d.mediosDeContacto[0].correoElectronico : d.mediosDeContacto[0].telefono}"></span>
                <span th:if="${#lists.isEmpty(d.mediosDeContacto)}" class="text-muted small">Sin contacto</span>
            </td>
            <td class="text-end">
                <a th:href="@{/donaciones(idDonante=${d.id})}" class="btn btn-sm btn-outline-success me-1" title="Ver Donaciones">
                    <i class="bi bi-gift-fill me-1"></i>Donaciones
                </a>
                <form th:action="@{/donantes/eliminar}" method="post" class="d-inline" onsubmit="return confirm('¿Eliminar donante?');">
                    <input type="hidden" name="id" th:value="${d.id}" />
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                        <i class="bi bi-trash"></i>
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>

</html>
