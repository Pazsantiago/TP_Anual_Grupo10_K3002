<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Listado de Donantes')}"></head>
<body class="container py-4">
<header th:replace="~{fragments/organisms :: encabezado('donantes')}"></header>

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Listado de Donantes</h2>
    <div class="d-flex gap-2">
        <a th:href="@{/donantes/importador}" class="btn btn-outline-secondary">Importar CSV</a>
        <a th:href="@{/donantes/nuevo}" class="btn btn-primary">+ Nuevo Donante</a>
    </div>
</div>

<div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<div class="table-responsive bg-white rounded shadow-sm border">
    <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Nombre / Razón Social</th>
            <th>Contacto Principal</th>
            <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${donantes}">
            <td th:text="${d.id}">1</td>
            <td class="fw-bold" th:text="${d.nombre}">Juan Pérez</td>
            <td>
                <span th:if="${d.contactoPredeterminado != null}"
                      th:text="${d.contactoPredeterminado.correoElectronico} + ' (' + ${d.contactoPredeterminado.tipo} + ')'">
                    juan@email.com (EMAIL)
                </span>
                <span th:if="${d.contactoPredeterminado == null}" class="text-muted">Sin contacto registrado</span>
            </td>
            <td class="text-end">
                <a th:href="@{/donaciones(idDonante=${d.id})}" class="btn btn-sm btn-outline-primary me-1">Ver Donaciones</a>
                <form method="post" th:action="@{/donantes/eliminar}" onsubmit="return confirm('¿Seguro deseas eliminar este donante?');" style="display:inline;">
                    <input type="hidden" name="id" th:value="${d.id}"/>
                    <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${donantes == null or #lists.isEmpty(donantes)}">
            <td colspan="4" class="text-center py-4 text-muted">No hay donantes registrados.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
