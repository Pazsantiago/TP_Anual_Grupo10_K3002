<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Entidad beneficiaria')}"></head>
<body>
<header th:replace="~{fragments/organisms :: encabezado('entidades')}"></header>

<main id="contenido" class="container page">
  <nav th:replace="~{fragments/molecules :: migas}"></nav>

  <header class="page-head">
    <h1 class="page-head__title">Registrar entidad beneficiaria</h1>
    <div class="cluster">
      <a class="btn btn--secondary" th:href="@{/entidades}">Volver a entidades</a>
    </div>
  </header>

  <div th:replace="~{fragments/molecules :: mensajes}"></div>

  <section class="card">
    <form class="form" th:action="@{/entidades/nueva}" method="post">
      <p class="form__note">Los campos marcados con <span class="field__required" aria-hidden="true">*</span> son obligatorios.</p>
      <th:block th:replace="~{fragments/formularios :: datos-entidad(false)}"></th:block>
      <div class="cluster">
        <button class="btn" type="submit">Registrar entidad</button>
        <a class="btn btn--secondary" th:href="@{/entidades}">Cancelar</a>
      </div>
    </form>
  </section>
</main>

<footer th:replace="~{fragments/organisms :: pie}"></footer>
</body>
</html>
