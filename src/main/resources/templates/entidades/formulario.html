<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="container py-4">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<h2 class="mb-4">Registrar Entidad Beneficiaria</h2>

<form th:action="@{/entidadesBeneficiarias}" th:object="${entidad}" method="post">
    <div class="mb-3">
        <label class="form-label">Razón Social</label>
        <input type="text" class="form-control" name="razonSocial" th:field="*{razonSocial}" required />
    </div>
    <div class="mb-3">
        <label class="form-label">Teléfono de Contacto</label>
        <input type="text" class="form-control" name="telefono" th:field="*{telefono}" required />
    </div>
    <div class="mb-3">
        <label class="form-label">Correo Electrónico del Representante</label>
        <input type="email" class="form-control" name="correoRepresentante" th:field="*{correoRepresentante}" required />
    </div>
    <div class="mb-3">
        <label class="form-label">Dirección</label>
        <input type="text" class="form-control" name="direccion" th:field="*{direccion}" required />
    </div>

    <div class="d-flex justify-content-between mt-4">
        <a th:href="@{/entidadesBeneficiarias}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-success">Guardar Entidad</button>
    </div>
</form>
</body>
</html>
