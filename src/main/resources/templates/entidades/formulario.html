<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="container py-4">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<h2 class="mb-4">Registrar Entidad Beneficiaria</h2>

<form th:action="@{/entidades/nueva}" th:object="${entidad}" method="post" class="card p-4 shadow-sm">

    <div class="row g-2 mb-3">
        <div class="col-md-6">
            <label class="form-label">Razón Social</label>
            <input type="text" name="razonSocial" th:value="${entidad.razonSocial}" class="form-control" placeholder="Ej: Comedor Infantil San Cayetano" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Teléfono de Contacto</label>
            <input type="text" name="telefono" th:value="${entidad.telefono}" class="form-control" placeholder="+5491123456789" required>
        </div>
        <div class="col-md-12">
            <label class="form-label">Correo Electrónico del Representante</label>
            <input type="email" name="correoRepresentante" th:value="${entidad.correoRepresentante}" class="form-control" placeholder="representante@comedor.org" required>
        </div>
    </div>

    <h5 class="mt-3">Dirección</h5>
    <div class="row g-2 mb-3">
        <div class="col-md-6">
            <label class="form-label">Calle</label>
            <input type="text" name="direccion.calle" th:value="${entidad.direccion?.calle}" class="form-control" placeholder="Av. Corrientes">
        </div>
        <div class="col-md-2">
            <label class="form-label">Altura</label>
            <input type="text" name="direccion.altura" th:value="${entidad.direccion?.altura}" class="form-control" placeholder="1234">
        </div>
        <div class="col-md-4">
            <label class="form-label">Localidad</label>
            <input type="text" name="direccion.localidad" th:value="${entidad.direccion?.localidad}" class="form-control" placeholder="CABA">
        </div>
    </div>

    <div class="d-flex justify-content-between mt-4">
        <a href="/entidades" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-warning">Guardar Entidad</button>
    </div>
</form>
</body>
</html>
