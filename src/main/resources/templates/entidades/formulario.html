<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container col-md-6">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 th:text="${entidad.id == null ? 'Nueva Entidad Beneficiaria' : 'Editar Entidad'}">Entidad</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/entidadesBeneficiarias}" th:object="${entidad}" method="post">

                <div class="mb-3">
                    <label class="form-label">Razón Social</label>
                    <input type="text" name="razonSocial" th:value="${entidad.razonSocial}" placeholder="Ej: Comedor La Carbonilla" class="form-control" required>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Teléfono</label>
                        <input type="text" name="telefono" th:value="${entidad.telefono}" placeholder="+5491123456789" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Correo Representante</label>
                        <input type="email" name="correoRepresentante" th:value="${entidad.correoRepresentante}" placeholder="representante@comedor.org" class="form-control">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Dirección</label>
                    <input type="text" name="direccion" th:value="${entidad.direccion}" placeholder="Ej: Av. Medrano 951, CABA" class="form-control">
                </div>

                <!-- SECCIÓN NECESIDAD INICIAL -->
                <h5 class="mt-4 border-top pt-3">Necesidad Inicial (Opcional)</h5>
                <p class="text-muted small">Podés registrar una primera necesidad ahora o agregarla más tarde desde el listado de Necesidades.</p>

                <div class="row g-2 mb-3">
                    <div class="col-md-3">
                        <label class="form-label">Tipo de Necesidad</label>
                        <select name="necesidades[0].tipo" class="form-select">
                            <option value="EXTRAORDINARIA">Extraordinaria</option>
                            <option value="RECURRENTE">Recurrente</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Subcategoría</label>
                        <input type="text" name="necesidades[0].subcategoria.nombre" placeholder="Ej: arroz" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">ID Categoría</label>
                        <input type="number" name="necesidades[0].subcategoria.categoria.id" value="1" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Cantidad Objetivo</label>
                        <input type="number" name="necesidades[0].cantidadObjetivo" placeholder="Ej: 5" class="form-control" min="1">
                    </div>
                </div>

                <button type="submit" class="btn btn-success mt-3">Guardar Entidad</button>
                <a href="/entidadesBeneficiarias" class="btn btn-secondary mt-3">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
