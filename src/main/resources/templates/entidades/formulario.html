<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container col-md-6">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 th:text="${entidad.id == null ? 'Nueva Entidad Beneficiaria' : 'Editar Entidad'}">Entidad</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/entidades}" th:object="${entidad}" method="post">
                <input type="text" th:field="*{razonSocial}" placeholder="Razón Social (ej: La-carbonilla)" class="form-control mb-2" required>
                <input type="text" th:field="*{telefono}" placeholder="Teléfono" class="form-control mb-2">
                <input type="email" th:field="*{correoRepresentante}" placeholder="Correo Representante" class="form-control mb-2">

                <h5 class="mt-3">Necesidad Inicial</h5>
                <select th:field="*{necesidades[0].tipo}" class="form-select mb-2">
                    <option value="EXTRAORDINARIA">Extraordinaria</option>
                    <option value="RECURRENTE">Recurrente</option>
                </select>
                <input type="text" th:field="*{necesidades[0].subcategoria.nombre}" placeholder="Subcategoría (ej: fideos)" class="form-control mb-2">
                <input type="number" th:field="*{necesidades[0].subcategoria.categoria.id}" value="1" class="form-control mb-2" placeholder="ID Categoría">
                <input type="number" th:field="*{necesidades[0].cantidadObjetivo}" placeholder="Cantidad Objetivo" class="form-control mb-2">

                <button type="submit" class="btn btn-success mt-3">Guardar Entidad</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
