<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="container py-4">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<h2 class="mb-4">Registrar Entidad Beneficiaria</h2>

<form th:action="@{/entidadesBeneficiarias}" th:object="${entidad}" method="post">
    <div class="card mb-4">
        <div class="card-header bg-light fw-bold">Datos Generales</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-12">
                    <label class="form-label">Razón Social</label>
                    <input type="text" th:field="*{razonSocial}" class="form-control" required/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Teléfono de Contacto</label>
                    <input type="text" th:field="*{telefono}" class="form-control" required/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Correo Electrónico del Representante</label>
                    <input type="email" th:field="*{correoRepresentante}" class="form-control" required/>
                </div>
                <div class="col-md-12">
                    <label class="form-label">Dirección</label>
                    <input type="text" th:field="*{direccion}" class="form-control" placeholder="Ej: Av. Medrano 951" required/>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex gap-2">
        <a th:href="@{/entidadesBeneficiarias}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-success">Guardar Entidad</button>
    </div>
</form>
</body>
</html>
