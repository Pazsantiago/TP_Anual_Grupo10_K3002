<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Listado de entidades')}"></head>
<body>

<header th:replace="~{fragments/organisms :: encabezado('entidades')}"></header>

<main id="contenido" class="container page">
    <header class="page-head">
        <h1 class="page-head__title">Listado de Entidades Beneficiarias</h1>
        <div class="cluster" th:if="${session.userRol != null and (#strings.toUpperCase(session.userRol) == 'ENTIDAD' or #strings.toUpperCase(session.userRol) == 'ROLE_ENTIDAD')}">
            <a th:href="@{/entidadesBeneficiarias/nueva}" class="btn">+ Nueva Entidad</a>
        </div>
    </header>

    <div th:replace="~{fragments/molecules :: mensajes}"></div>

    <div class="table-wrap" role="region" aria-label="Tabla de Entidades Beneficiarias" tabindex="0">
        <table class="table">
            <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Razón Social</th>
                <th scope="col">Dirección</th>
                <th scope="col">Teléfono</th>
                <th scope="col">Correo Representante</th>
                <th scope="col">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ent : ${entidades}">
                <td th:text="${ent.id}">1</td>
                <td th:text="${ent.razonSocial}">Comedor Sol</td>
                <td th:text="${ent.direccion}">Av. Medrano 951</td>
                <td th:text="${ent.telefono}">11 4444-5555</td>
                <td th:text="${ent.correoRepresentante}">contacto@comedor.org</td>
                <td>
                    <span th:if="${session.userRol != null and (#strings.toUpperCase(session.userRol) != 'ADMIN' and #strings.toUpperCase(session.userRol) != 'ROLE_ENTIDAD')}">Ninguna</span>
                    <div class="cluster" th:if="${session.userRol != null and (#strings.toUpperCase(session.userRol) == 'ENTIDAD' or #strings.toUpperCase(session.userRol) == 'ROLE_ENTIDAD')}">
                        <a th:href="@{/necesidades(idEntidad=${ent.id})}" class="btn btn--secondary">Ver Necesidades</a>
                        <form method="post" th:action="@{/entidadesBeneficiarias/eliminar}" onsubmit="return confirm('¿Seguro deseas eliminar esta entidad?');" style="display:inline;">
                            <input type="hidden" name="id" th:value="${ent.id}"/>
                            <button type="submit" class="btn btn--danger">Eliminar</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${entidades == null or #lists.isEmpty(entidades)}">
                <td colspan="6">
                    <div th:replace="~{fragments/molecules :: estado-vacio('No hay entidades beneficiarias registradas.')}"></div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/organisms :: pie}"></footer>
</body>
</html>
