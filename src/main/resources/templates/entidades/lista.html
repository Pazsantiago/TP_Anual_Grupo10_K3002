<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Listado de entidades')}"></head>
<body class="container py-4">
<header th:replace="~{fragments/organisms :: encabezado('entidades')}"></header>

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Listado de Entidades Beneficiarias</h2>
    <a th:href="@{/entidadesBeneficiarias/nueva}" class="btn btn-primary">+ Nueva Entidad</a>
</div>

<div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<div class="table-responsive bg-white rounded shadow-sm border">
    <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Razón Social</th>
            <th>Dirección</th>
            <th>Teléfono</th>
            <th>Correo Representante</th>
            <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ent : ${entidades}">
            <td th:text="${ent.id}">1</td>
            <td class="fw-bold" th:text="${ent.razonSocial}">Comedor Sol</td>
            <td th:text="${ent.direccion}">Av. Medrano 951</td>
            <td th:text="${ent.telefono}">11 4444-5555</td>
            <td th:text="${ent.correoRepresentante}">contacto@comedor.org</td>
            <td class="text-end">
                <a th:href="@{/necesidades(idEntidad=${ent.id})}" class="btn btn-sm btn-outline-primary me-1">Ver Necesidades</a>
                <form method="post" th:action="@{/entidadesBeneficiarias/eliminar}" onsubmit="return confirm('¿Seguro deseas eliminar esta entidad?');" style="display:inline;">
                    <input type="hidden" name="id" th:value="${ent.id}"/>
                    <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${entidades == null or #lists.isEmpty(entidades)}">
            <td colspan="6" class="text-center py-4 text-muted">No hay entidades beneficiarias registradas.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
