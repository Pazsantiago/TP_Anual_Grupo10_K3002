<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="container py-4 bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-dark"><i class="bi bi-building-fill text-warning me-2"></i>Entidades Beneficiarias</h2>
    <a href="/entidades/nueva" class="btn btn-warning text-dark"><i class="bi bi-plus-circle-fill me-1"></i>+ Nueva Entidad</a>
</div>

<div class="table-responsive bg-white rounded shadow-sm border">
    <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Razón Social</th>
            <th>Teléfono</th>
            <th>Correo Representante</th>
            <th>Dirección</th>
            <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(entidades)}">
            <td colspan="6" class="text-center text-muted py-4">No hay entidades beneficiarias registradas.</td>
        </tr>
        <tr th:each="ent : ${entidades}">
            <td th:text="${ent.id}">1</td>
            <td th:text="${ent.razonSocial}">Comedor Los Niños</td>
            <td th:text="${ent.telefono}">+54911000000</td>
            <td th:text="${ent.correoRepresentante}">representante@comedor.org</td>
            <td th:text="${ent.direccion != null ? ent.direccion.calle + ' ' + ent.direccion.altura : 'Sin Dirección'}">Medrano 951</td>
            <td class="text-end">
                <div class="btn-group btn-group-sm">
                    <a th:href="@{/necesidades(idEntidad=${ent.id})}" class="btn btn-outline-warning text-dark" title="Ver Necesidades">
                        <i class="bi bi-list-task me-1"></i>Necesidades
                    </a>
                    <form th:action="@{/entidades/eliminar}" method="post" class="d-inline" onsubmit="return confirm('¿Eliminar entidad?');">
                        <input type="hidden" name="id" th:value="${ent.id}" />
                        <button type="submit" class="btn btn-outline-danger"><i class="bi bi-trash"></i></button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
