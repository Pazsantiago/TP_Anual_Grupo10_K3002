<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<!-- TEMPLATE (Atomic Design, nivel plantilla). Define el <head> común: metadatos, estilos y scripts.
     Los fragmentos viven por capa, de lo simple a lo complejo:
       fragments/atoms.html       unidades mínimas      (badge de estado, marca de campo obligatorio)
       fragments/molecules.html   átomos agrupados      (migas de pan, mensajes, aviso de error, estado vacío)
       fragments/organisms.html   bloques completos     (encabezado, encabezado público, pie, recursos de mapa)
       fragments/formularios.html organismos de formulario (datos de donante, datos de entidad)
     Estructura de toda página:
       <header>  encabezado   →  <main id="contenido">  migas · cabecera de página (h1) · mensajes · <section>s  →  <footer>  pie
     Para sumar un componente: crear static/css/<capa>/<nombre>.css y agregar UNA línea de <link> acá. -->
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DonaTrack: gestión y trazabilidad de donaciones de UTN Solidaria, desde el depósito hasta la entidad beneficiaria.">
  <meta name="theme-color" content="#17564a">
  <title th:text="${titulo} + ' - DonaTrack'">DonaTrack</title>

  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/base.css}">
  <link rel="stylesheet" th:href="@{/css/templates/page.css}">
  <link rel="stylesheet" th:href="@{/css/atoms/button.css}">
  <link rel="stylesheet" th:href="@{/css/atoms/badge.css}">
  <link rel="stylesheet" th:href="@{/css/atoms/meter.css}">
  <link rel="stylesheet" th:href="@{/css/atoms/progress.css}">
  <link rel="stylesheet" th:href="@{/css/molecules/card.css}">
  <link rel="stylesheet" th:href="@{/css/molecules/banner.css}">
  <link rel="stylesheet" th:href="@{/css/molecules/field.css}">
  <link rel="stylesheet" th:href="@{/css/molecules/stat.css}">
  <link rel="stylesheet" th:href="@{/css/molecules/empty-state.css}">
  <link rel="stylesheet" th:href="@{/css/molecules/media.css}">
  <link rel="stylesheet" th:href="@{/css/molecules/timeline.css}">
  <link rel="stylesheet" th:href="@{/css/molecules/breadcrumb.css}">
  <link rel="stylesheet" th:href="@{/css/organisms/topbar.css}">
  <link rel="stylesheet" th:href="@{/css/organisms/footer.css}">
  <link rel="stylesheet" th:href="@{/css/organisms/hero.css}">
  <link rel="stylesheet" th:href="@{/css/organisms/form.css}">
  <link rel="stylesheet" th:href="@{/css/organisms/table.css}">
  <link rel="stylesheet" th:href="@{/css/organisms/map.css}">

  <script th:src="@{/js/app.js}" defer></script>
  <script th:src="@{/js/ui.js}" defer></script>
</head>
</html>
