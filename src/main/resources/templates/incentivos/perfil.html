<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Perfil de incentivos')}"></head>
<body>
<header th:replace="~{fragments/organisms :: encabezado('incentivos')}"></header>

<main id="contenido" class="container page">
  <nav th:replace="~{fragments/molecules :: migas}"></nav>

  <header class="page-head">
    <h1 class="page-head__title" th:text="'Incentivos del donante N.º ' + ${idDonante}">Incentivos del donante N.º 1</h1>
    <div class="cluster">
      <a class="btn btn--secondary" th:href="@{/incentivos/misiones}">Cómo se sube de categoría</a>
      <a class="btn btn--secondary" th:href="@{/incentivos}">Volver a incentivos</a>
    </div>
  </header>

  <div th:replace="~{fragments/molecules :: mensajes}"></div>

  <!-- Donante sin perfil: no es un error, se ofrece crearlo -->
  <section class="card" th:if="${sinPerfil}">
    <div class="empty-state">
      <p class="empty-state__text">Este donante todavía no tiene un perfil de incentivos.</p>
      <form th:action="@{/incentivos/donantes/{id}/perfil(id=${idDonante})}" method="post">
        <button class="btn" type="submit">Crear perfil de incentivos</button>
      </form>
    </div>
  </section>

  <div class="stack" th:if="${metricas}">
    <section th:replace="~{fragments/incentivos :: widget-metricas(${metricas})}"></section>
    <section th:replace="~{fragments/incentivos :: widget-mision(${mision}, ${idDonante})}"></section>
    <section th:replace="~{fragments/incentivos :: widget-insignias(${insignias})}"></section>
  </div>
</main>

<footer th:replace="~{fragments/organisms :: pie}"></footer>
</body>
</html>
