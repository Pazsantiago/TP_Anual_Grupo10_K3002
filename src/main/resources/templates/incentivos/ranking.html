<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Incentivos')}"></head>
<body>
<header th:replace="~{fragments/organisms :: encabezado('incentivos')}"></header>

<main id="contenido" class="container page">
  <nav th:replace="~{fragments/molecules :: migas}"></nav>

  <header class="page-head">
    <h1 class="page-head__title">Incentivos</h1>
    <div class="cluster">
      <a class="btn btn--secondary" th:href="@{/incentivos/misiones}">Categorías y misiones</a>
      <a class="btn btn--secondary" th:href="@{/incentivos/gestion}">Gestión de perfiles</a>
    </div>
  </header>

  <div th:replace="~{fragments/molecules :: mensajes}"></div>

  <div class="stack">
    <section class="card" aria-labelledby="titulo-buscar">
      <h2 id="titulo-buscar">Perfil de un donante</h2>
      <form class="form" th:action="@{/incentivos/buscar}" method="get">
        <div class="field">
          <label class="field__label" for="donanteId">Número de donante <span class="field__hint">(es el mismo que en Donantes)</span></label>
          <input class="field__control" id="donanteId" name="donanteId" type="number" min="1" inputmode="numeric" placeholder="Ej: 5" required aria-required="true">
        </div>
        <div class="cluster">
          <button class="btn" type="submit">Ver perfil</button>
        </div>
      </form>
    </section>

    <section th:replace="~{fragments/incentivos :: widget-ranking(${ranking})}"></section>
  </div>
</main>

<footer th:replace="~{fragments/organisms :: pie}"></footer>
</body>
</html>
