<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container col-md-6">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4>Registrar Necesidad</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/entidades/{id}/necesidades(id=${idEntidad})}" th:object="${necesidad}" method="post">

                <!-- Select para alternar tipo de necesidad -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Tipo de Necesidad</label>
                    <select class="form-select" onchange="location.href='?tipo=' + this.value">
                        <option value="EXTRAORDINARIA" th:selected="${necesidad instanceof T(org.example.donacionesfrontend.dominio.necesidad.NecesidadExtraordinaria)}">Extraordinaria</option>
                        <option value="RECURRENTE" th:selected="${necesidad instanceof T(org.example.donacionesfrontend.dominio.necesidad.NecesidadRecurrente)}">Recurrente</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <input type="text" th:field="*{descripcion}" placeholder="Ej: Arroz para comedor comunitario" class="form-control" required>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Subcategoría</label>
                        <input type="text" th:field="*{subcategoria.nombre}" placeholder="arroz" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">ID Categoría</label>
                        <input type="number" th:field="*{subcategoria.categoria.id}" value="1" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Cantidad Objetivo</label>
                    <input type="number" th:field="*{cantidadObjetivo}" placeholder="Cantidad requerida" class="form-control" min="1" required>
                </div>

                <!-- SECCIÓN EXTRAORDINARIA -->
                <div th:if="${necesidad instanceof T(org.example.donacionesfrontend.dominio.necesidad.NecesidadExtraordinaria)}" class="mb-3">
                    <label class="form-label">Fecha Límite</label>
                    <input type="date" th:field="*{fechaLimite}" class="form-control">
                </div>

                <!-- SECCIÓN RECURRENTE -->
                <div th:if="${necesidad instanceof T(org.example.donacionesfrontend.dominio.necesidad.NecesidadRecurrente)}" class="mb-3">
                    <label class="form-label">Periodicidad</label>
                    <select th:field="*{periodicidad}" class="form-select">
                        <option value="SEMANAL">Semanal</option>
                        <option value="MENSUAL">Mensual</option>
                        <option value="ANUAL">Anual</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success mt-3">Guardar Necesidad</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
