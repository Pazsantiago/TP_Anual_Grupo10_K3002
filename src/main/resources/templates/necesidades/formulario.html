<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="container py-4">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<h2 class="mb-4">Registrar Necesidad</h2>

<form th:action="@{/necesidades}" method="post">
    <input type="hidden" name="idEntidad" th:value="${idEntidadSeleccionada}" />

    <div class="mb-3">
        <label class="form-label">Tipo de Necesidad</label>
        <select class="form-select" name="tipo">
            <option value="EXTRAORDINARIA">Extraordinaria</option>
            <option value="RECURRENTE">Recurrente</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Descripción</label>
        <input type="text" class="form-control" name="descripcion" required />
    </div>

    <div class="mb-3">
        <label class="form-label">Subcategoría</label>
        <input type="text" class="form-control" name="subcategoria.nombre" required placeholder="Ej: Harina, Leche..." />
    </div>

    <div class="mb-3">
        <label class="form-label">Cantidad Objetivo</label>
        <input type="number" class="form-control" name="objetivo" required />
    </div>

    <div class="d-flex justify-content-between mt-4">
        <a th:href="@{/necesidades(idEntidad=${idEntidadSeleccionada})}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-success">Guardar Necesidad</button>
    </div>
</form>
</body>
</html>
