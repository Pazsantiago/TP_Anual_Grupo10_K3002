<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear necesidad de una entidad')}"></head>
<body>

<header th:replace="~{fragments/organisms :: encabezado('donaciones')}"></header>

<main id="contenido" class="container page" style="max-width: var(--form-max);">
    <header class="page-head">
        <h1 class="page-head__title">Registrar Necesidad</h1>
    </header>

    <div th:replace="~{fragments/molecules :: mensajes}"></div>
    <p class="banner banner--error" role="alert" th:if="${error}" th:text="${error}"></p>

    <section class="card mb-4">
        <label class="field__label">Tipo de Necesidad</label>
        <div class="cluster">
            <a th:href="@{/necesidades/nueva(idEntidad=${idEntidadSeleccionada}, tipo='EXTRAORDINARIA')}"
               class="btn"
               th:classappend="${tipoActual == 'RECURRENTE' ? 'btn--secondary' : ''}">
                Extraordinaria
            </a>
            <a th:href="@{/necesidades/nueva(idEntidad=${idEntidadSeleccionada}, tipo='RECURRENTE')}"
               class="btn"
               th:classappend="${tipoActual == 'RECURRENTE' ? '' : 'btn--secondary'}">
                Recurrente
            </a>
        </div>
    </section>

    <form class="form" th:action="@{/necesidades}" th:object="${necesidad}" method="post">
        <input type="hidden" th:field="*{tipo}" th:value="${tipoActual}"/>

        <fieldset class="fieldset">
            <legend class="fieldset__legend">1. Entidad Beneficiaria</legend>
            <div class="field">
                <label class="field__label" for="idEntidadSelect">Seleccionar Entidad <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                <select id="idEntidadSelect" name="idEntidad" class="field__control" required>
                    <option value="">-- Seleccionar Entidad Beneficiaria --</option>
                    <option th:each="e : ${entidades}"
                            th:value="${e.id}"
                            th:text="${e.razonSocial}"
                            th:selected="${e.id == idEntidadSeleccionada}">
                    </option>
                </select>
            </div>
        </fieldset>

        <fieldset class="fieldset">
            <legend class="fieldset__legend">2. Detalle de la Necesidad</legend>
            <div class="field-row">
                <div class="field">
                    <label class="field__label" for="catSelect">Categoría Padre <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                    <select id="catSelect" th:field="*{subcategoria.idCategoria}" class="field__control" required>
                        <option value="">-- Categoría --</option>
                        <option th:each="cat : ${categorias}"
                                th:value="${cat.id}"
                                th:text="${cat.nombre}">
                        </option>
                    </select>
                </div>
                <div class="field">
                    <label class="field__label" for="subcatNombre">Nombre Subcategoría <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                    <input id="subcatNombre" type="text" th:field="*{subcategoria.nombre}" class="field__control" placeholder="Ej: Frazadas" required/>
                </div>
            </div>

            <div class="field-row">
                <div class="field">
                    <label class="field__label" for="descNecesidad">Descripción <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                    <input id="descNecesidad" type="text" th:field="*{descripcion}" class="field__control" placeholder="Ej: Frazadas de abrigo para invierno" required/>
                </div>
                <div class="field">
                    <label class="field__label" for="cantObj">Cantidad Objetivo <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                    <input id="cantObj" type="number" th:field="*{cantidadObjetivo}" class="field__control" required min="1"/>
                </div>
            </div>

            <th:block th:if="${tipoActual == 'RECURRENTE'}">
                <div class="field-row">
                    <div class="field">
                        <label class="field__label" for="periodoDias">Período de Frecuencia (Días) <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                        <input id="periodoDias" type="number" th:field="*{periodoRequestDTO.periodoDias}" class="field__control" placeholder="Ej: 30" required min="1"/>
                    </div>
                    <div class="field">
                        <label class="field__label" for="inicioPeriodo">Fecha Inicio de Período <span th:replace="~{fragments/atoms :: requerido}"></span></label>
                        <input id="inicioPeriodo" type="date" th:field="*{periodoRequestDTO.inicioPeriodo}" class="field__control" required/>
                    </div>
                </div>
            </th:block>
        </fieldset>

        <div class="cluster">
            <button type="submit" class="btn">Guardar Necesidad</button>
            <a th:href="@{/necesidades(idEntidad=${idEntidadSeleccionada})}" class="btn btn--secondary">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/organisms :: pie}"></footer>
</body>
</html>
