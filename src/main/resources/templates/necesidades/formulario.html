<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear necesidad de una entidad')}"></head>
<body class="container py-4">
<header th:replace="~{fragments/organisms :: encabezado('donaciones')}"></header>
<h2 class="mb-4">Registrar Necesidad</h2>

<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<div class="card mb-4">
    <div class="card-body">
        <label class="form-label fw-bold">Tipo de Necesidad</label>
        <div>
            <a th:href="@{/necesidades/nueva(idEntidad=${idEntidadSeleccionada}, tipo='EXTRAORDINARIA')}"
               class="btn"
               th:classappend="${tipoActual == 'RECURRENTE' ? 'btn-outline-primary' : 'btn-primary'}">
                Extraordinaria
            </a>
            <a th:href="@{/necesidades/nueva(idEntidad=${idEntidadSeleccionada}, tipo='RECURRENTE')}"
               class="btn ms-2"
               th:classappend="${tipoActual == 'RECURRENTE' ? 'btn-primary' : 'btn-outline-primary'}">
                Recurrente
            </a>
        </div>
    </div>
</div>

<form th:action="@{/necesidades}" th:object="${necesidad}" method="post">
    <input type="hidden" th:field="*{tipo}" th:value="${tipoActual}"/>

    <div class="card mb-4 border-primary">
        <div class="card-header bg-primary text-white fw-bold">1. Entidad Beneficiaria</div>
        <div class="card-body">
            <label class="form-label fw-bold">Seleccionar Entidad</label>
            <select name="idEntidad" class="form-select" required>
                <option value="">-- Seleccionar Entidad Beneficiaria --</option>
                <option th:each="e : ${entidades}"
                        th:value="${e.id}"
                        th:text="${e.razonSocial}"
                        th:selected="${e.id == idEntidadSeleccionada}">
                </option>
            </select>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header bg-secondary text-white fw-bold">2. Detalle de la Necesidad</div>
        <div class="card-body row g-3">

            <div class="col-md-6">
                <label class="form-label">Categoría Padre</label>
                <select th:field="*{subcategoria.idCategoria}" class="form-select" required>
                    <option value="">-- Categoría --</option>
                    <option th:each="cat : ${categorias}"
                            th:value="${cat.id}"
                            th:text="${cat.nombre}">
                    </option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Nombre Subcategoría</label>
                <input type="text" th:field="*{subcategoria.nombre}" class="form-control" placeholder="Ej: Frazadas" required/>
            </div>

            <div class="col-md-8">
                <label class="form-label">Descripción</label>
                <input type="text" th:field="*{descripcion}" class="form-control" placeholder="Ej: Frazadas de abrigo para invierno" required/>
            </div>

            <div class="col-md-4">
                <label class="form-label">Cantidad Objetivo</label>
                <input type="number" th:field="*{cantidadObjetivo}" class="form-control" required min="1"/>
            </div>

            <th:block th:if="${tipoActual == 'RECURRENTE'}">
                <div class="col-md-6">
                    <label class="form-label">Período de Frecuencia (Días)</label>
                    <input type="number" th:field="*{periodoRequestDTO.periodoDias}" class="form-control" placeholder="Ej: 30" required min="1"/>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Fecha Inicio de Período</label>
                    <input type="date" th:field="*{periodoRequestDTO.inicioPeriodo}" class="form-control" required/>
                </div>
            </th:block>

        </div>
    </div>

    <div class="d-flex gap-2">
        <a th:href="@{/necesidades(idEntidad=${idEntidadSeleccionada})}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-success">Guardar Necesidad</button>
    </div>
</form>

</body>
</html>
