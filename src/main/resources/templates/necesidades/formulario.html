<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container col-md-6">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4>Registrar Necesidad</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/necesidades}" th:object="${necesidad}" method="post">

                <input type="hidden" name="idEntidad" th:value="${idEntidadSeleccionada}" />

                <div class="mb-3">
                    <label class="form-label fw-bold">Tipo de Necesidad</label>
                    <select name="tipo" class="form-select">
                        <option value="EXTRAORDINARIA" th:selected="${necesidad.class.simpleName == 'NecesidadExtraordinaria'}">Extraordinaria</option>
                        <option value="RECURRENTE" th:selected="${necesidad.class.simpleName == 'NecesidadRecurrente'}">Recurrente</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <input type="text" th:field="*{descripcion}" placeholder="Ej: Arroz para comedor" class="form-control" required>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Subcategoría</label>
                        <input type="text" th:field="*{subcategoria.nombre}" placeholder="arroz" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">ID Categoría</label>
                        <input type="number" th:field="*{subcategoria.categoria.id}" value="1" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Cantidad Objetivo</label>
                    <input type="number" th:field="*{cantidadObjetivo}" placeholder="Cantidad requerida" class="form-control" min="1" required>
                </div>

                <button type="submit" class="btn btn-success mt-3">Guardar Necesidad</button>
                <a th:href="@{/necesidades(idEntidad=${idEntidadSeleccionada})}" class="btn btn-secondary mt-3">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
