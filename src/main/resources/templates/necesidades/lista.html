<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="container py-4">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<h2>Gestión de Entidades Beneficiarias</h2>

<div class="mb-3">
    <a href="/entidadesBeneficiarias/nueva" class="btn btn-primary">+ Nueva Entidad Beneficiaria</a>
</div>

<table class="table table-bordered table-hover align-middle">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Razón Social</th>
        <th>Dirección</th>
        <th>Teléfono</th>
        <th>Correo Representante</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ent : ${entidades}">
        <td th:text="${ent.id}">1</td>
        <td th:text="${ent.razonSocial}">Comedor Los Lapachos</td>
        <td th:text="${ent.direccion}">Av. San Martín 1234</td>
        <td th:text="${ent.telefono}">011-4567-8900</td>
        <td th:text="${ent.correoRepresentante}">contacto@lapachos.org</td>
        <td>
            <div class="d-flex gap-2">
                <a th:href="@{/necesidades(idEntidad=${ent.id})}" class="btn btn-sm btn-info">Ver Necesidades</a>
                <form method="post" action="/entidadesBeneficiarias/eliminar" onsubmit="return confirm('¿Seguro deseas eliminar esta entidad?');">
                    <input type="hidden" name="id" th:value="${ent.id}"/>
                    <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                </form>
            </div>
        </td>
    </tr>
    <tr th:if="${entidades == null or #lists.isEmpty(entidades)}">
        <td colspan="6" class="text-center text-muted">No hay entidades beneficiarias registradas.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
