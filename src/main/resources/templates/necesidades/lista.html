<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Listado de necesidades')}"></head>
<body>

<header th:replace="~{fragments/organisms :: encabezado('necesidades')}"></header>

<main id="contenido" class="container page">
    <header class="page-head">
        <h1 class="page-head__title">Necesidades Registradas</h1>
        <div class="cluster">
            <a th:href="@{/necesidades/nueva(idEntidad=${idEntidadSeleccionada})}" class="btn">+ Nueva Necesidad</a>
        </div>
    </header>

    <div th:replace="~{fragments/molecules :: mensajes}"></div>

    <form method="get" th:action="@{/necesidades}" class="card form form--wide mb-4">
        <div class="field-row">
            <div class="field">
                <label class="field__label" for="selectEntidad">Seleccionar Entidad Beneficiaria:</label>
                <select id="selectEntidad" name="idEntidad" class="field__control" onchange="this.form.submit()">
                    <option value="" disabled th:selected="${idEntidadSeleccionada == null}">-- Seleccionar Entidad --</option>
                    <option th:each="e : ${entidades}"
                            th:value="${e.id}"
                            th:text="${e.razonSocial}"
                            th:selected="${e.id == idEntidadSeleccionada}">
                    </option>
                </select>
            </div>
        </div>
    </form>

    <div th:if="${idEntidadSeleccionada != null}">
        <div class="table-wrap" role="region" aria-label="Tabla de Necesidades" tabindex="0">
            <table class="table">
                <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Descripción</th>
                    <th scope="col">Cant. Asignada / Objetivo</th>
                    <th scope="col">Estado</th>
                    <th scope="col">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="n : ${necesidades}">
                    <td th:text="${n.id}">1</td>
                    <td th:text="${n.descripcion}">Calzado infantil</td>
                    <td th:text="${n.cantidadAsignada} + ' / ' + ${n.cantidadObjetivo}">5 / 20</td>
                    <td>
                        <span class="badge badge--ok" th:if="${n.estaSatisfechaConDonacion}">Satisfecha</span>
                        <span class="badge" th:if="${!n.estaSatisfechaConDonacion}">Pendiente</span>
                    </td>
                    <td>
                        <form method="post" th:action="@{/necesidades/eliminar}" onsubmit="return confirm('¿Deseas eliminar esta necesidad?');" style="display:inline;">
                            <input type="hidden" name="idEntidad" th:value="${idEntidadSeleccionada}"/>
                            <input type="hidden" name="idNecesidad" th:value="${n.id}"/>
                            <button type="submit" class="btn btn--danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${necesidades == null or #lists.isEmpty(necesidades)}">
                    <td colspan="5">
                        <div th:replace="~{fragments/molecules :: estado-vacio('No hay necesidades registradas para esta entidad.')}"></div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:if="${idEntidadSeleccionada == null}">
        <div th:replace="~{fragments/molecules :: estado-vacio('Por favor, selecciona una entidad para consultar sus necesidades.')}"></div>
    </div>
</main>

<footer th:replace="~{fragments/organisms :: pie}"></footer>
</body>
</html>
