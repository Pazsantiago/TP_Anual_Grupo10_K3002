<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="container py-4 bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-dark"><i class="bi bi-cart-check-fill text-danger me-2"></i>Necesidades</h2>
    <div>
        <a href="/home" class="btn btn-outline-secondary me-2">
            <i class="bi bi-house-fill me-1"></i>Inicio
        </a>
        <a th:if="${idEntidadSeleccionada != null}"
           th:href="@{/necesidades/nueva(idEntidad=${idEntidadSeleccionada})}"
           class="btn btn-danger">
            <i class="bi bi-plus-lg me-1"></i>+ Registrar Necesidad
        </a>
    </div>
</div>

<div class="card p-3 shadow-sm mb-4 border-0">
    <form method="get" th:action="@{/necesidades}" class="row align-items-center g-3">
        <div class="col-md-3">
            <label class="form-label fw-bold mb-0">Seleccionar Entidad:</label>
        </div>
        <div class="col-md-7">
            <select name="idEntidad" class="form-select" onchange="this.form.submit()">
                <option value="">-- Seleccionar una entidad beneficiaria --</option>
                <option th:each="e : ${entidades}"
                        th:value="${e.id}"
                        th:selected="${idEntidadSeleccionada != null and e.id == idEntidadSeleccionada}"
                        th:text="${e.id + ' - ' + e.razonSocial}">
                </option>
            </select>
        </div>
    </form>
</div>

<div th:if="${idEntidadSeleccionada != null}" class="table-responsive bg-white rounded shadow-sm border">
    <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Tipo</th>
            <th>Descripción</th>
            <th>Subcategoría</th>
            <th>Objetivo</th>
            <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(necesidades)}">
            <td colspan="6" class="text-center text-muted py-4">Esta entidad no posee necesidades registradas.</td>
        </tr>
        <tr th:each="n : ${necesidades}">
            <td th:text="${n.id}">1</td>
            <td>
                <span th:if="${n.class.simpleName == 'NecesidadExtraordinaria'}" class="badge bg-danger">Extraordinaria</span>
                <span th:if="${n.class.simpleName == 'NecesidadRecurrente'}" class="badge bg-primary">Recurrente</span>
            </td>
            <td th:text="${n.descripcion}">Arroz para comedor</td>
            <td>
                <span class="badge bg-secondary" th:text="${n.subcategoria?.nombre}"></span>
            </td>
            <td th:text="${n.cantidadObjetivo}">10</td>
            <td class="text-end">
                <form th:action="@{/necesidades/eliminar}" method="post" class="d-inline" onsubmit="return confirm('¿Eliminar necesidad?');">
                    <input type="hidden" name="idEntidad" th:value="${idEntidadSeleccionada}" />
                    <input type="hidden" name="idNecesidad" th:value="${n.id}" />
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                        <i class="bi bi-trash"></i>
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div th:if="${idEntidadSeleccionada == null}" class="alert alert-info shadow-sm text-center">
    Por favor seleccioná una entidad beneficiaria para consultar y registrar sus necesidades.
</div>

</body>
</html>
