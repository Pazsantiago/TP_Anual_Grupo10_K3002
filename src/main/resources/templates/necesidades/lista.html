<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="container py-4">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Necesidades por Entidad</h2>
    <div>
        <a th:href="@{/entidadesBeneficiarias}" class="btn btn-outline-secondary me-2">Volver a Entidades</a>
        <a th:if="${idEntidadSeleccionada != null}" th:href="@{/necesidades/nueva(idEntidad=${idEntidadSeleccionada})}" class="btn btn-primary">+ Registrar Necesidad</a>
    </div>
</div>


<div class="card mb-4">
    <div class="card-body">
        <form th:action="@{/necesidades}" method="get" class="row align-items-center">
            <div class="col-auto">
                <label class="form-label mb-0 fw-bold">Seleccionar Entidad:</label>
            </div>
            <div class="col-md-6">
                <select name="idEntidad" class="form-select" onchange="this.form.submit()">
                    <option value="">-- Seleccionar una entidad --</option>
                    <option th:each="e : ${entidades}"
                            th:value="${e.id}"
                            th:text="${e.razonSocial}"
                            th:selected="${e.id == idEntidadSeleccionada}">
                    </option>
                </select>
            </div>
        </form>
    </div>
</div>


<table th:if="${idEntidadSeleccionada != null}" class="table table-striped table-bordered align-middle">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Descripción</th>
        <th>Subcategoría</th>
        <th>Cantidad Objetivo</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(necesidades)}">
        <td colspan="5" class="text-center text-muted">Esta entidad no registra necesidades cargadas.</td>
    </tr>
    <tr th:each="n : ${necesidades}">
        <td th:text="${n.id}">1</td>
        <td th:text="${n.descripcion}">Harina de trigo</td>
        <td th:text="${n.subcategoria != null ? n.subcategoria.nombre : 'Sin subcategoría'}">Harina</td>
        <td th:text="${n.cantidadObjetivo}">100</td>
        <td>
            <form th:action="@{/necesidades/eliminar}" method="post" onsubmit="return confirm('¿Eliminar necesidad?');">
                <input type="hidden" name="idEntidad" th:value="${idEntidadSeleccionada}"/>
                <input type="hidden" name="idNecesidad" th:value="${n.id}"/>
                <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
