<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Enviar notificación')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('notificaciones')}"></header>

<main id="contenido" class="container page">
  <div class="page-head">
    <h1 class="page-head__title">Enviar notificación</h1>
  </div>

  <div th:replace="~{fragments/layout :: mensajes}"></div>

  <section class="card">
    <form class="form" th:action="@{/notificaciones/nueva}" th:object="${form}" method="post" novalidate>

      <p class="form__note">Los campos marcados con <span class="field__required" aria-hidden="true">*</span> son obligatorios.</p>

      <fieldset class="fieldset">
        <legend class="fieldset__legend">Destinatario</legend>

        <div class="field">
          <label class="field__label" for="nombre">Nombre <span class="field__required" aria-hidden="true">*</span></label>
          <input class="field__control" id="nombre" type="text" th:field="*{nombre}" placeholder="Ana Pérez" autocomplete="name" aria-required="true"
                 th:attr="aria-describedby=${#fields.hasErrors('nombre')} ? 'nombre-error', aria-invalid=${#fields.hasErrors('nombre')} ? 'true'">
          <p class="field__error" id="nombre-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>
        </div>

        <div class="field">
          <label class="field__label" for="email">Correo electrónico <span class="field__hint">(para envíos por correo)</span></label>
          <input class="field__control" id="email" type="email" th:field="*{email}" placeholder="ana@mail.com" autocomplete="email">
        </div>

        <div class="field">
          <label class="field__label" for="telefono">Teléfono <span class="field__hint">(para SMS)</span></label>
          <input class="field__control" id="telefono" type="tel" th:field="*{telefono}" placeholder="+54 11 5555-5555" autocomplete="tel">
        </div>

        <div class="field">
          <label class="field__label" for="whatsapp">WhatsApp <span class="field__hint">(para WhatsApp)</span></label>
          <input class="field__control" id="whatsapp" type="tel" th:field="*{whatsapp}" placeholder="+54 11 5555-5555">
        </div>
      </fieldset>

      <div class="field">
        <label class="field__label" for="medio">Medio de envío <span class="field__required" aria-hidden="true">*</span></label>
        <select class="field__control" id="medio" th:field="*{medio}" aria-required="true"
                th:attr="aria-describedby=${#fields.hasErrors('medio')} ? 'medio-error', aria-invalid=${#fields.hasErrors('medio')} ? 'true'">
          <option value="">Elegí un medio</option>
          <option th:each="m : ${medios}" th:value="${m.name()}" th:text="${m.etiqueta}">Correo electrónico</option>
        </select>
        <p class="field__error" id="medio-error" th:if="${#fields.hasErrors('medio')}" th:errors="*{medio}"></p>
      </div>

      <div class="field">
        <label class="field__label" for="asunto">Asunto <span class="field__hint">(opcional)</span></label>
        <input class="field__control" id="asunto" type="text" th:field="*{asunto}" placeholder="Tu donación fue asignada">
      </div>

      <div class="field">
        <label class="field__label" for="cuerpo">Mensaje <span class="field__required" aria-hidden="true">*</span></label>
        <textarea class="field__control" id="cuerpo" th:field="*{cuerpo}" placeholder="Escribí el texto que va a recibir la persona" aria-required="true"
                  th:attr="aria-describedby=${#fields.hasErrors('cuerpo')} ? 'cuerpo-error', aria-invalid=${#fields.hasErrors('cuerpo')} ? 'true'"></textarea>
        <p class="field__error" id="cuerpo-error" th:if="${#fields.hasErrors('cuerpo')}" th:errors="*{cuerpo}"></p>
      </div>

      <div class="cluster">
        <button class="btn" type="submit">Enviar notificación</button>
        <a class="btn btn--secondary" th:href="@{/notificaciones}">Cancelar</a>
      </div>
    </form>
  </section>
</main>
</body>
</html>
