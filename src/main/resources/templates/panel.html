<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Panel')}"></head>
<body>
<header th:replace="~{fragments/organisms :: encabezado('')}"></header>

<main id="contenido" class="container page">
  <nav th:replace="~{fragments/molecules :: migas}"></nav>

  <header class="page-head">
    <h1 class="page-head__title">Panel de gestión</h1>
  </header>

  <div th:replace="~{fragments/molecules :: mensajes}"></div>

  <div class="grid">
    <article class="card" th:each="item : ${navegacion}">
      <h2 th:text="${item.etiqueta}">Sección</h2>
      <p th:text="${item.descripcion}">Descripción de la sección.</p>
      <a class="btn btn--secondary" th:href="@{${item.ruta}}">Abrir<span class="sr-only" th:text="' ' + ${item.etiqueta}"></span></a>
    </article>
  </div>
</main>

<footer th:replace="~{fragments/organisms :: pie}"></footer>
</body>
</html>
