<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Rankings de entidades')}"></head>
<body>

<header th:replace="~{fragments/organisms :: encabezado('rankings')}"></header>

<main id="contenido" class="container page">
    <header class="page-head">
        <h1 class="page-head__title">Rankings de Entidades Beneficiarias</h1>
        <div class="cluster">
            <form method="post" th:action="@{/rankings/generar}">
                <button type="submit" class="btn">Recalcular Rankings</button>
            </form>
        </div>
    </header>

    <div th:replace="~{fragments/molecules :: mensajes}"></div>

    <div class="stack" th:unless="${rankings == null or #lists.isEmpty(rankings)}">
        <section class="card" th:each="sr : ${rankings}">
            <h2>
                Donación Segmentada #<span th:text="${sr.segmentada.idSegmentada}">1</span>
                (<span th:text="${sr.segmentada.categoria}">Alimentos</span> - <span th:text="${sr.segmentada.subcategoria}">Lácteos</span>)
            </h2>
            <div class="table-wrap" role="region" aria-label="Ranking de donación segmentada" tabindex="0">
                <table class="table">
                    <thead>
                    <tr>
                        <th scope="col">Posición</th>
                        <th scope="col">Entidad Beneficiaria</th>
                        <th scope="col">Puntaje</th>
                        <th scope="col">Algoritmo Aplicado</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${sr.rankings}">
                        <td th:text="'#' + ${r.posicion}">#1</td>
                        <td th:text="${r.entidadBeneficiaria.razonSocial}">Comedor Sol</td>
                        <td th:text="${r.puntaje}">95.5</td>
                        <td th:text="${r.algoritmoUsado}">PRIORIDAD_SUB_ATENDIDOS</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <div th:if="${rankings == null or #lists.isEmpty(rankings)}">
        <div th:replace="~{fragments/molecules :: estado-vacio('No hay rankings calculados actualmente. Haz clic en Recalcular Rankings para generar uno.')}"></div>
    </div>
</main>

<footer th:replace="~{fragments/organisms :: pie}"></footer>
</body>
</html>
