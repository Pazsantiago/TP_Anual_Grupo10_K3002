<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Rankings de entidades')}"></head>
<body class="container py-4">
<header th:replace="~{fragments/organisms :: encabezado('rankings')}"></header>

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Rankings de Entidades Beneficiarias</h2>
    <form method="post" th:action="@{/rankings/generar}">
        <button type="submit" class="btn btn-success">Recalcular Rankings</button>
    </form>
</div>

<div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<th:block th:each="sr : ${rankings}">
    <div class="card mb-4 shadow-sm border-0">
        <div class="card-header bg-dark text-white fw-bold">
            <i class="bi bi-box-seam me-2"></i>
            Donación Segmentada #<span th:text="${sr.segmentada.idSegmentada}">1</span>
            (<span th:text="${sr.segmentada.categoria}">Alimentos</span> - <span th:text="${sr.segmentada.subcategoria}">Lácteos</span>)
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Posición</th>
                    <th>Entidad Beneficiaria</th>
                    <th>Puntaje</th>
                    <th>Algoritmo Aplicado</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${sr.rankings}">
                    <td class="fw-bold" th:text="'#' + ${r.posicion}">#1</td>
                    <td th:text="${r.entidadBeneficiaria.razonSocial}">Comedor Sol</td>
                    <td th:text="${r.puntaje}">95.5</td>
                    <td th:text="${r.algoritmoUsado}">PRIORIDAD_SUB_ATENDIDOS</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>

<div th:if="${rankings == null or #lists.isEmpty(rankings)}" class="alert alert-info text-center py-4">
    No hay rankings calculados actualmente. Haz clic en "Recalcular Rankings" para generar el primer informe.
</div>

</body>
</html>
