<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="container py-4 bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-dark"><i class="bi bi-trophy-fill text-warning me-2"></i>Rankings de Entidades Beneficiarias</h2>
    <div>
        <form th:action="@{/rankings/generar}" method="post" class="d-inline">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-cpu-fill me-1"></i> Generar Nuevo Ranking
            </button>
        </form>
    </div>
</div>

<div th:if="${exito != null}" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${exito}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<div class="table-responsive bg-white rounded shadow-sm border">
    <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
        <tr>
            <th>ID Donación Segmentada</th>
            <th>ID Entidad</th>
            <th>Posición</th>
            <th>Puntaje</th>
            <th>Algoritmo</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(rankings)}">
            <td colspan="5" class="text-center text-muted py-4">No hay rankings calculados actualmente.</td>
        </tr>
        <tr th:each="r : ${rankings}">
            <td th:text="${r['idSegmentada']}">1</td>
            <td th:text="${r['idEntidad'] != null ? r['idEntidad'] : 'N/A'}">10</td>
            <td><span class="badge bg-warning text-dark" th:text="${'#' + (r['posicion'] != null ? r['posicion'] : '-')}">#1</span></td>
            <td th:text="${r['puntaje']}">100.0</td>
            <td th:text="${r['algoritmoUtilizado'] != null ? r['algoritmoUtilizado'] : 'General'}">Por Necesidad</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
