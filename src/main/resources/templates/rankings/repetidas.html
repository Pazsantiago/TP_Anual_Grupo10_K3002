<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Rankings repetidos de entidad')}"></head>
<body class="container py-4 bg-light">
<header th:replace="~{fragments/organisms :: encabezado('rankings')}"></header>

<h2 class="mb-4">Entidades Repetidas en Posición #1</h2>

<form method="get" th:action="@{/rankings/repetidas}" class="row align-items-center g-3 mb-4">
    <div class="col-auto">
        <label for="idDonacion" class="col-form-label fw-bold">ID Donación Original:</label>
    </div>
    <div class="col-auto">
        <input type="number" id="idDonacion" name="idDonacion" th:value="${idDonacionSeleccionada}" class="form-control" placeholder="Ingrese ID de Donación" required />
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-primary">Buscar Entidades</button>
    </div>
</form>

<div th:if="${idDonacionSeleccionada != null}" class="table-responsive bg-white rounded shadow-sm border">
    <table class="table table-hover align-middle mb-0">
        <thead class="table-dark">
        <tr>
            <th>ID Entidad</th>
            <th>Razón Social</th>
            <th>Dirección</th>
            <th>Teléfono</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${repetidas}">
            <td th:text="${item.id}">1</td>
            <td class="fw-bold" th:text="${item.razonSocial}">Hogar de Niños</td>
            <td th:text="${item.direccion}">Av. Corrientes 1234</td>
            <td th:text="${item.telefono}">11 5555-6666</td>
        </tr>
        <tr th:if="${#lists.isEmpty(repetidas)}">
            <td colspan="4" class="text-center py-4 text-muted">No se encontraron entidades repetidas en la primera posición para esta donación.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
